    - name: Checkout Repository (sparse)
      id: sparse_checkout
      if: ${{ steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure' }}
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        target_sha="$GITHUB_SHA"
        scored_control=0
        if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${ENACT_CONTROL_PIN_REQUIRED:-}" = "true" ]; then
            scored_control=1
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            if [ "$scored_control" -ne 1 ]; then
                echo "::error::control_checkout_sha override is refused outside scored-control workflow_dispatch (control_pin_required=true)" >&2
                exit 1
            fi
            case "$ENACT_CONTROL_CHECKOUT_SHA" in
                *[!0-9a-fA-F]*)
                    echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                    exit 1
                    ;;
            esac
            if [ "${#ENACT_CONTROL_CHECKOUT_SHA}" -ne 40 ]; then
                echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                exit 1
            fi
            target_sha="$ENACT_CONTROL_CHECKOUT_SHA"
        elif [ "$scored_control" -eq 1 ]; then
            echo "::error::scored-control dispatch requires non-empty control_checkout_sha" >&2
            exit 1
        fi
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        cd "$GITHUB_WORKSPACE"
        # shellcheck disable=SC2015
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local protocol.version 2
        git config --local fetch.parallel 0
        git config --local checkout.workers 0
        git config --local index.threads 0
        git config --local advice.detachedHead false
        git config --local gc.auto 0
        cone=()
        while IFS= read -r entry; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [ -n "$entry" ] && cone+=("$entry")
        done <<<"${ENACT_SPARSE_CONE:-}"
        depth="${ENACT_FETCH_DEPTH:-1}"
        fetch_args=(--no-tags --no-recurse-submodules)
        if [ "$depth" != "0" ]; then
            fetch_args+=("--depth=$depth")
        fi
        narrow_cone=0
        if [ "${#cone[@]}" -gt 0 ] && [ "${#cone[@]}" -le 8 ]; then
            narrow_cone=1
            for entry in "${cone[@]}"; do
                case "$entry" in
                    . | ./ | .. | ../*)
                        narrow_cone=0
                        break
                        ;;
                    .* | cue.mod | cue.mod/* | bin | bin/* | */*)
                        ;;
                    *)
                        narrow_cone=0
                        break
                        ;;
                esac
            done
        fi
        if [ "$narrow_cone" = 1 ]; then
            fetch_args+=(--filter=blob:none)
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            git fetch -q "${fetch_args[@]}" origin "$target_sha"
        else
            git fetch -q "${fetch_args[@]}" origin "$target_sha" 2>/dev/null \
                || git fetch -q "${fetch_args[@]}" origin "$GITHUB_REF"
        fi
        if [ "${#cone[@]}" -gt 0 ]; then
            normalized=()
            for entry in "${cone[@]}"; do
                case "$entry" in
                    */.enact-direct-files)
                        normalized+=("$entry")
                        ;;
                    *)
                        kind=$(git cat-file -t "$target_sha:$entry" 2>/dev/null || true)
                        if [ "$kind" = "blob" ]; then
                            case "$entry" in
                                */*) normalized+=("${entry%/*}/.enact-direct-files") ;;
                            esac
                        else
                            normalized+=("$entry")
                        fi
                        ;;
                esac
            done
            if [ "${#normalized[@]}" -gt 0 ]; then
                git sparse-checkout set --cone "${normalized[@]}"
            fi
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            git checkout -q --force --detach "$target_sha"
        else
            case "$GITHUB_REF" in
                refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$target_sha" ;;
                *) git checkout -q --force --detach "$target_sha" ;;
            esac
        fi
        checked_commit=$(git rev-parse HEAD)
        checked_tree=$(git rev-parse "HEAD^{tree}")
        if [ "$checked_commit" != "$target_sha" ]; then
            echo "::error::shallow sparse checkout commit mismatch: expected $target_sha, got $checked_commit" >&2
            exit 1
        fi
        echo "Checked out $checked_commit (tree $checked_tree) (shallow sparse)"
      env:
        ENACT_CONTROL_CHECKOUT_SHA: ${{ inputs.control_checkout_sha }}
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_FETCH_DEPTH: "1"
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          showcase
          patches
          tools/hogli
          packages/owners-yaml
          packages/personhog-proto
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          turbo.json
          tsconfig.json
          tsconfig.dev.json
          tsconfig.kea-typegen.json
          .oxfmtrc.json
          .oxlintrc.json
          .prettierignore
          .stylelintrc.js
          .stylelintignore
          .nvmrc
          .kearc
          postcss.config.js
          pyproject.toml
          uv.lock
          conftest.py
          pytest.ini
          pytest_boot_gc.py
          .test_quarantine.json
          manage.py
          hogli.yaml
          posthog.json
          owners.yaml
          tach.toml
          depot.json
          dist-workspace.toml
          dagster_cloud.yaml
          frontend
          products
          packages
          common
          docs/onboarding
          playwright
          services/mcp
          .github/scripts/jest-retries.cjs
          posthog/hogql_queries/utils/breakdowns.py
          products/games
          products/canvas/packages
          products/visual_review/cli
          common/esbuilder
          common/tailwind
          common/replay-shared
          common/hogvm/typescript/src
          common/hogvm/typescript/package.json
          packages/llm-normalizer/src
          packages/llm-normalizer/package.json
          products/ai_observability/shared
          showcase/scripts/build_products.sh
          bin/validate-setup-tasks.mjs
          common/storybook/.storybook
          frontend/src
          packages/quill
    - name: Install committed enact & enve builds
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Ensure enve & enact CLI on PATH
      id: setup-runner
      run: enact ci setup-runner
    - name: Plan Explicit Cache Seed
      id: stage_plan
      run: |-
        {
          echo 'stage_has_work=true'
          echo 'stage_needs_node=true'
          echo 'stage_needs_python=true'
        } >> "$GITHUB_OUTPUT"
    - name: restore Host Cache [frontend tsgo declaration-emit cache]
      id: host_cache_frontend_tsgo
      if: ${{ (steps.runner_caches.outputs.host != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact ci host-cache restore
      env:
        ENACT_HOST_CACHE_KEY: frontend-tsgo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tsconfig.json', 'package.json', 'pnpm-lock.yaml') }}
        ENACT_HOST_CACHE_PATHS: .enact/state/tsgo
    - parallel:
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: ${{ (steps.stage_plan.outputs.stage_needs_node == 'true' && steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v4-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            .enact/state/pnpm-cache
            node_modules/.cache
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-v4-
      - name: Restore Cache [frontend tsgo declaration-emit cache]
        id: cache_frontend_tsgo
        if: ${{ (steps.host_cache_frontend_tsgo.outputs.hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: frontend-tsgo-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'package.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          path: .enact/state/tsgo
          restore-keys: |-
            frontend-tsgo-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'package.json', 'pnpm-lock.yaml') }}-
            frontend-tsgo-${{ runner.os }}-
    - name: Record Restored Package Caches
      if: ${{ (steps.runner_caches.outputs.host == '' && steps.node_l1_cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact ci cache-delta record
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache .enact/state/pnpm-cache
          node_l1_cache node_modules/.cache
        ENACT_CACHE_HITS: node_l1_cache=${{ steps.node_l1_cache.outputs.cache-hit }}
    - name: Pull Dependencies via enve
      if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact ci deps pull --remote signed
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID || env.R2_READ_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY || env.R2_READ_SECRET_ACCESS_KEY }}
        ENACT_ENVIRONMENT_DIRS: "[\".\",\"packages/quill\"]"
        ENACT_ENVIRONMENT_FILES: "[]"
        ENACT_JOB_SERVICES: ""
        ENACT_PREPARE_ENVIRONMENT_FILES: "[\"enve.cue\"]"
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Check enve Stores into the Host Cache
      if: ${{ (steps.runner_caches.outputs.host != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact ci check-store
    - name: Install Project Dependencies
      if: ${{ (hashFiles('package.json') != '' && steps.stage_plan.outputs.stage_needs_node == 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact ci deps install node --manager pnpm
      env:
        ENACT_ENVIRONMENT_FILE: enve.cue
    - name: Seed [frontend:typecheck]
      if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact run --pipeline .enact --workflow ci --all --no-cache -c frontend:typecheck
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
    - name: Diagnose Cgroup OOM on Failure
      if: ${{ failure() }}
      run: |-
        if [ -r /sys/fs/cgroup/memory.events ]; then
        oom=$(awk '$1 == "oom_kill" { print $2 }' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
        peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unknown)
        limit=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)
        echo "cgroup memory: oom_kill=${oom:-0} peak=${peak} max=${limit}"
        if [ "${oom:-0}" -gt 0 ] 2>/dev/null; then
        echo "::error::Container cgroup OOM-killed a process (oom_kill=${oom}, memory.peak=${peak}, memory.max=${limit})"
        fi
        fi
    - name: Diagnose Disk & Btrfs Qgroup on Failure
      if: ${{ failure() }}
      run: |-
        df -h || true
        df -i || true
        btrfs qgroup show -reF / 2>/dev/null || true
    - name: Log Cgroup Memory & PSI Telemetry
      if: ${{ always() }}
      run: |-
        if [ -d /sys/fs/cgroup ]; then
        anon=$(awk '$1 == "anon" { print $2 }' /sys/fs/cgroup/memory.stat 2>/dev/null || echo unknown)
        kernel=$(awk '$1 == "kernel" { print $2 }' /sys/fs/cgroup/memory.stat 2>/dev/null || echo unknown)
        peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unknown)
        limit=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)
        high=$(awk '$1 == "high" { print $2 }' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
        max_ev=$(awk '$1 == "max" { print $2 }' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
        oom=$(awk '$1 == "oom_kill" { print $2 }' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
        sampled=$(cat "${GHA_ANON_PEAK_FILE:-/dev/null}" 2>/dev/null || true)
        [ -n "$sampled" ] || sampled="nonreclaim_peak_sampled=unknown"
        psi=$(tr '\n' ' ' < /sys/fs/cgroup/memory.pressure 2>/dev/null || echo unavailable)
        echo "cgroup telemetry: anon=${anon} kernel=${kernel} peak=${peak} max=${limit} events(high=${high:-0},max=${max_ev:-0},oom_kill=${oom:-0}) ${sampled} psi=${psi}"
        fi
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ (!cancelled() && steps.runner_caches.outputs.host == '' && steps.node_l1_cache.outputs.cache-hit != 'true' && github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' && github.event_name != 'pull_request') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact ci cache-delta check
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache .enact/state/pnpm-cache
          node_l1_cache node_modules/.cache
        ENACT_CACHE_HITS: node_l1_cache=${{ steps.node_l1_cache.outputs.cache-hit }}
    - name: save Host Cache [frontend tsgo declaration-emit cache]
      id: save_host_cache_frontend_tsgo
      if: ${{ (steps.runner_caches.outputs.host != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact ci host-cache save
      env:
        ENACT_HOST_CACHE_KEY: frontend-tsgo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tsconfig.json', 'package.json', 'pnpm-lock.yaml') }}
        ENACT_HOST_CACHE_PATHS: .enact/state/tsgo
    - parallel:
      - name: Save Cache [frontend tsgo declaration-emit cache]
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' && steps.host_cache_frontend_tsgo.outputs.hit != 'true' && steps.cache_frontend_tsgo.outputs.cache-primary-key != '' && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.cache_frontend_tsgo.outputs.cache-matched-key, format('frontend-tsgo-{0}-{1}-', runner.os, hashFiles('tsconfig.json', 'package.json', 'pnpm-lock.yaml'))))) && github.event_name != 'pull_request' && steps.cache_frontend_tsgo.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_frontend_tsgo.outputs.cache-primary-key }}
          path: .enact/state/tsgo
      - name: Save Node dependency cache
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' && steps.stage_plan.outputs.stage_needs_node == 'true' && steps.cache_delta.outputs.node_l1_cache == 'true' && steps.runner_caches.outputs.host == '') && github.event_name != 'pull_request' && steps.node_l1_cache.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.node_l1_cache.outputs.cache-primary-key }}
          path: |-
            .enact/state/pnpm-store
            .enact/state/pnpm-cache
            node_modules/.cache
    - name: Upload Telemetry [telemetry-stage-seed-frontend-typecheck]
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-stage-seed-frontend-typecheck
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
          .enact/state/nodejs/*.services.log
          .enact/state/e2e/shard-*/failed/**
          .enact/state/e2e/shard-*/run/test-results/**
          playwright/test-results/**
        retention-days: "1"
  seed-products-typecheck:
    name: "Seed caches: Products typecheck"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' }}
    runs-on:
    - self-hosted
    - Linux
    - tonky-ci
    - tonky-ci-c2m13g
    timeout-minutes: 120
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        target_sha="$GITHUB_SHA"
        scored_control=0
        if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${ENACT_CONTROL_PIN_REQUIRED:-}" = "true" ]; then
            scored_control=1
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            if [ "$scored_control" -ne 1 ]; then
                echo "::error::control_checkout_sha override is refused outside scored-control workflow_dispatch (control_pin_required=true)" >&2
                exit 1
            fi
            case "$ENACT_CONTROL_CHECKOUT_SHA" in
                *[!0-9a-fA-F]*)
                    echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                    exit 1
                    ;;
            esac
            if [ "${#ENACT_CONTROL_CHECKOUT_SHA}" -ne 40 ]; then
                echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                exit 1
            fi
            target_sha="$ENACT_CONTROL_CHECKOUT_SHA"
        elif [ "$scored_control" -eq 1 ]; then
            echo "::error::scored-control dispatch requires non-empty control_checkout_sha" >&2
            exit 1
        fi
        export GIT_CONFIG_COUNT=2
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        export GIT_CONFIG_KEY_1=safe.directory
        export GIT_CONFIG_VALUE_1="$mirror"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        base_ref="${GITHUB_BASE_REF:-${ENACT_BASE_REF:-}}"
        depth="${ENACT_HOST_FETCH_DEPTH:-50}"
        fetch_args=(--no-tags)
        if [ "$depth" != "0" ]; then
            fetch_args+=("--depth=$depth")
        fi
        refs=()
        case "${GITHUB_REF:-}" in
            refs/heads/*|refs/pull/*|refs/tags/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        if [ -n "$base_ref" ] && [ "refs/heads/$base_ref" != "${GITHUB_REF:-}" ]; then
            refs+=("+refs/heads/$base_ref:refs/heads/$base_ref")
        fi
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            ref_current=""
            case "${GITHUB_REF:-}" in
                refs/heads/*|refs/pull/*|refs/tags/*) ref_current=$(git -C "$mirror" rev-parse --verify -q "$GITHUB_REF^{commit}" 2>/dev/null || true) ;;
                *) ref_current="$target_sha" ;;
            esac
            base_missing=0
            if [ -n "$base_ref" ] && ! git -C "$mirror" rev-parse --verify -q "refs/heads/$base_ref^{commit}" >/dev/null 2>&1; then
                base_missing=1
            fi
            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$target_sha" ] || [ "$base_missing" = 1 ] || ! git -C "$mirror" cat-file -e "$target_sha^{commit}" 2>/dev/null; then
                if [ "${#refs[@]}" -gt 0 ]; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "${refs[@]}" \
                        || git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "$target_sha"
                else
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "$target_sha"
                fi
                if ! git -C "$mirror" cat-file -e "$target_sha^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "$target_sha"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        mirror_branches=()
        case "${GITHUB_REF:-}" in
            refs/heads/*) mirror_branches+=("${GITHUB_REF#refs/heads/}") ;;
        esac
        if [ -n "$base_ref" ] && [ "refs/heads/$base_ref" != "${GITHUB_REF:-}" ]; then
            mirror_branches+=("$base_ref")
        fi
        if [ "${#mirror_branches[@]}" -gt 0 ]; then
            for ref_branch in "${mirror_branches[@]}"; do
                ref_sha=$(git -C "$mirror" rev-parse --verify -q "refs/heads/$ref_branch^{commit}" 2>/dev/null || true)
                if [ -n "$ref_sha" ]; then
                    git update-ref "refs/remotes/origin/$ref_branch" "$ref_sha"
                fi
            done
        fi
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            raw_cone=()
            while IFS= read -r entry; do
                entry="${entry#"${entry%%[![:space:]]*}"}"
                entry="${entry%"${entry##*[![:space:]]}"}"
                [ -n "$entry" ] && raw_cone+=("$entry")
            done <<<"$ENACT_SPARSE_CONE"
            cone=()
            to_check=()
            if [ "${#raw_cone[@]}" -gt 0 ]; then
                for entry in "${raw_cone[@]}"; do
                    case "$entry" in
                        */.enact-direct-files)
                            cone+=("$entry")
                            ;;
                        *)
                            to_check+=("$entry")
                            ;;
                    esac
                done
            fi
            if [ "${#to_check[@]}" -gt 0 ]; then
                idx=0
                while IFS= read -r kind; do
                    entry="${to_check[$idx]}"
                    idx=$((idx + 1))
                    if [ "$kind" = "blob" ]; then
                        case "$entry" in
                            */*) cone+=("${entry%/*}/.enact-direct-files") ;;
                        esac
                    else
                        cone+=("$entry")
                    fi
                done < <(
                    for entry in "${to_check[@]}"; do
                        printf '%s:%s\n' "${target_sha:-$GITHUB_SHA}" "$entry"
                    done | git cat-file --batch-check='%(objecttype)'
                )
            fi
            if [ "${#cone[@]}" -gt 0 ]; then
                git sparse-checkout set --cone "${cone[@]}"
            fi
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            git checkout -q --force --detach "$target_sha"
        else
            case "${GITHUB_REF:-}" in
                refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$target_sha" ;;
                *) git checkout -q --force --detach "$target_sha" ;;
            esac
        fi
        checked_commit=$(git rev-parse HEAD)
        checked_tree=$(git rev-parse "HEAD^{tree}")
        if [ "$checked_commit" != "$target_sha" ]; then
            echo "::error::host checkout commit mismatch: expected $target_sha, got $checked_commit" >&2
            exit 1
        fi
        echo "Checked out $checked_commit (tree $checked_tree) through the host mirror"
      env:
        ENACT_CONTROL_CHECKOUT_SHA: ${{ inputs.control_checkout_sha }}
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_GIT_TOKEN: ${{ github.token }}
