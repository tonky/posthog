      env:
        CI_COMPONENT: ${{ matrix.component }}
        ENACT_MATRIX_COMMAND: ${{ matrix.command }}
        ENACT_MAX_PARALLEL: ${{ matrix.max_parallel }}
        ENACT_PREEMPTION_NOTICE_SEC: ${{ matrix.preemption_notice_sec }}
        ENACT_RECORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) && 'every' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && 'auto' || 'off' }}
        ENACT_RUNNER_TIER: ${{ matrix.runner_tier }}
        ENACT_TOPOLOGY: ${{ matrix.topology }}
    - name: Upload Execution Telemetry & Workflow Dashboard
      if: ${{ (always()) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-${{ matrix.task_id }}
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
        retention-days: "1"
    - name: Upload Recorded Footprints
      if: ${{ (always() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch)) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
