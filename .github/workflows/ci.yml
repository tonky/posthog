    - master
    - main
    - perf/ci-modernization
    - perf/ci-showcase
    types:
    - opened
    - synchronize
  workflow_dispatch:
    inputs:
      all:
        description: Force execution of all components regardless of git changes
        required: false
        default: "false"
      base_ref:
        description: Target base branch for diff detection (e.g. main, master, a release branch)
        required: false
      control_checkout_sha:
        description: Optional 40-char commit SHA of the original tested merge commit to check out instead of GITHUB_SHA in control mode
        required: false
      control_history_artifact_id:
        description: Numeric artifact ID of the archived enact-history-input ZIP from control_source_run_id
        required: false
      control_history_zip_sha256:
        description: Expected SHA-256 of the archived enact-history-input ZIP verified before extraction
        required: false
      control_map_artifact_id:
        description: Numeric artifact ID of the archived reach map ZIP from control_source_run_id
        required: false
      control_map_zip_sha256:
        description: Expected SHA-256 of the archived reach map ZIP verified before extraction
        required: false
      control_pin_required:
        description: Require all four matched-control SHA-256 input pins before fan-out
        required: false
        default: "false"
      control_selection_artifact_id:
        description: Numeric artifact ID of the archived enact-selection ZIP from control_source_run_id
        required: false
      control_selection_zip_sha256:
        description: Expected SHA-256 of the archived enact-selection ZIP verified before extraction
        required: false
      control_source_run_attempt:
        description: Numeric run attempt of control_source_run_id verified for scored controls
        required: false
      control_source_run_id:
        description: Numeric workflow run ID of the enrolled on-arm run whose archived inputs are restored for scored controls
        required: false
      files:
        description: File(s) to plan as changed instead of the git diff, comma-separated (e.g. one test file)
        required: false
      force_warm_suites:
        description: Comma-separated <component>:<job> suites forced to re-record all targets during warm_reach=true
        required: false
        default: ""
      no_cache:
        description: Disable task cache, forcing full execution
        required: false
        default: "false"
      pin_diff_sha256:
        description: Expected SHA-256 of canonical diff bytes for matched controls
        required: false
      pin_history_sha256:
        description: Expected SHA-256 of history snapshot (snapshot.json) for matched controls
        required: false
      pin_reach_age_sha256:
        description: Expected SHA-256 of reach age sidecar (map.age.json) for matched controls
        required: false
      pin_reach_map_sha256:
        description: Expected SHA-256 of handed-off reach map (map.bin) for matched controls
        required: false
      seed_caches:
        description: Run the jobs of seeded caches cold and save the caches (on the default branch)
        required: false
        default: "false"
      updated:
        description: Component(s) to emulate as updated
        required: false
      warm_reach:
        description: Run every suite and record each test without a fresh reach footprint (on the default branch, after an enact upgrade)
        required: false
        default: "false"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
