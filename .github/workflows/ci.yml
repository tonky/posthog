          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          showcase
          patches
          tools/hogli
          packages/owners-yaml
          packages/personhog-proto
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          turbo.json
          tsconfig.json
          tsconfig.dev.json
          tsconfig.kea-typegen.json
          .oxfmtrc.json
          .oxlintrc.json
          .prettierignore
          .stylelintrc.js
          .stylelintignore
          .nvmrc
          .kearc
          postcss.config.js
          pyproject.toml
          uv.lock
          conftest.py
          pytest.ini
          pytest_boot_gc.py
