    - name: Install committed enact & enve builds
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Ensure enve & enact CLI on PATH
      id: setup-runner
      run: enact ci setup-runner
    - name: Restore history Handoff
      id: history-host
      if: env.ENACT_HOST_CACHE != ''
      continue-on-error: true
      run: enact ci handoff history --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-history-input"
      env:
        ENACT_HANDOFF_ARTIFACT: ${{ needs.detect.outputs.history_input_artifact }}
        GH_TOKEN: ${{ github.token }}
    - name: Download the Selected CI History
      if: steps.history-host.outputs.ready != 'true'
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.detect.outputs.history_input_artifact }}
        path: ${{ runner.temp }}/enact-history-input
    - name: Import the Selected CI History
      run: |-
        export ENACT_HISTORY_DIR="$RUNNER_TEMP/enact-history"
        printf 'ENACT_HISTORY_DIR=%s\n' "$ENACT_HISTORY_DIR" >> "$GITHUB_ENV"
        enact ci history import --input "$RUNNER_TEMP/enact-history-input/snapshot.json" --manifest "$RUNNER_TEMP/enact-history-input/snapshot.manifest.json" --output "$ENACT_HISTORY_DIR"
    - name: Cache history Handoff on the Receiving Host
      if: env.ENACT_HOST_CACHE != '' && steps.history-host.outputs.ready != 'true'
      continue-on-error: true
      run: enact ci handoff history --publish --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-history-input"
      env:
        ENACT_HANDOFF_ARTIFACT: ${{ needs.detect.outputs.history_input_artifact }}
    - name: Plan Stage [Preflight]
      id: stage_plan
      run: |-
        if [ -n "${ENACT_DETECT_STAGE_WORK:-}" ] && [ "$ENACT_DETECT_STAGE_WORK" != "null" ]; then
          {
            echo "stage_has_work=${ENACT_DETECT_STAGE_HAS_WORK:-false}"
            echo "stage_needs_node=${ENACT_DETECT_STAGE_NEEDS_NODE:-false}"
            echo "stage_needs_python=${ENACT_DETECT_STAGE_NEEDS_PYTHON:-false}"
          } >> "$GITHUB_OUTPUT"
          echo "Reused detect stage plan for [preflight]"
          exit 0
        fi
        RESOLVED=$(enact ci resolve-base) || exit
        eval "$RESOLVED"
        PLAN_ARGS=()
        for arg in "$@"; do
          case "$arg" in --no-cache | --rerun) ;; *) PLAN_ARGS+=("$arg") ;; esac
        done
        set -- "${PLAN_ARGS[@]}"
        enact plan --pipeline .enact --workflow ci "$@" --stage preflight --github-output "$GITHUB_OUTPUT"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID || env.R2_READ_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY || env.R2_READ_SECRET_ACCESS_KEY }}
        ENACT_BASE_REF: ${{ inputs.base_ref || github.base_ref || github.event.pull_request.base.ref }}
        ENACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        ENACT_DETECT_STAGE_HAS_WORK: ${{ needs.detect.outputs.stage_work != '' && fromJson(needs.detect.outputs.stage_work)['preflight'].has_work || '' }}
        ENACT_DETECT_STAGE_NEEDS_NODE: ${{ needs.detect.outputs.stage_work != '' && fromJson(needs.detect.outputs.stage_work)['preflight'].needs_node || '' }}
        ENACT_DETECT_STAGE_NEEDS_PYTHON: ${{ needs.detect.outputs.stage_work != '' && fromJson(needs.detect.outputs.stage_work)['preflight'].needs_python || '' }}
        ENACT_DETECT_STAGE_WORK: ${{ needs.detect.outputs.stage_work != '' && toJson(fromJson(needs.detect.outputs.stage_work)['preflight']) || '' }}
        ENACT_EVENT_BEFORE: ${{ github.event.before }}
        ENACT_FORCE_NO_CACHE: ${{ inputs.no_cache == 'true' || vars.ENACT_NO_CACHE == 'true' || contains(github.event.pull_request.title, '[no-cache]') || contains(github.event.pull_request.body, '[no-cache]') || contains(github.event.pull_request.labels.*.name, 'no-cache') }}
        ENACT_FORCE_RERUN: ${{ contains(github.event.pull_request.title, '[rerun]') || contains(github.event.pull_request.body, '[rerun]') || contains(github.event.pull_request.labels.*.name, 'rerun') || contains(github.event.pull_request.labels.*.name, 'showcase') || startsWith(github.head_ref, 'showcase/') || startsWith(github.ref_name, 'showcase/') }}
        ENACT_INPUT_ALL: ${{ inputs.all }}
        ENACT_INPUT_FILES: ${{ inputs.files }}
        ENACT_INPUT_UPDATED: ${{ inputs.updated }}
        ENACT_INTEGRATION_BRANCH: ${{ vars.ENACT_INTEGRATION_BRANCH }}
        ENACT_PIN_DIFF_SHA256: ${{ inputs.pin_diff_sha256 }}
        ENACT_PIN_HISTORY_SHA256: ${{ inputs.pin_history_sha256 }}
        ENACT_PIN_REACH_AGE_SHA256: ${{ inputs.pin_reach_age_sha256 }}
        ENACT_PIN_REACH_MAP_SHA256: ${{ inputs.pin_reach_map_sha256 }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_REACH_PULLED: "1"
        ENACT_RUNNER_ALLOCATION: "{\"cpus\":6.0,\"memory_mb\":5120,\"runtime_reserve_mb\":2048}"
        ENACT_SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - parallel:
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: ${{ (steps.stage_plan.outputs.stage_needs_node == 'true' && steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v4-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            .enact/state/pnpm-cache
            node_modules/.cache
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-v4-
      - name: Restore Python build & venv cache
        id: python_l1_cache
        if: ${{ (hashFiles('pyproject.toml', 'requirements.txt') != '' && steps.runner_caches.outputs.host == '' && steps.stage_plan.outputs.stage_needs_python == 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-python-v2-${{ hashFiles('uv.lock', 'pyproject.toml', 'requirements.txt', 'poetry.lock', 'enve.lock') }}
          path: |-
            /tmp/.cache/uv
            /tmp/.cache/pip
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-python-v2-
      - name: Restore Rust target & cargo cache [cli/target]
        id: rust_l1_cache_cli_target
        if: ${{ (hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',cli/target,') && steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-rust-cli_target-${{ hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}-${{ hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') }}-${{ github.sha }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
          restore-keys: |-
            ${{ runner.os }}-rust-cli_target-${{ hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}-${{ hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') }}-
            ${{ runner.os }}-rust-cli_target-${{ hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}-
      - name: Restore Rust target & cargo cache [cli/target] from the Host Cache
        if: ${{ (hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',cli/target,') && steps.runner_caches.outputs.host != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        run: |-
          base="$ENACT_HOST_CACHE/repo/cargo-target"
          src="$base/$ENACT_RUST_HOST_KEY"
          seeded=""
          if [ ! -d "$src" ] && [ -n "${ENACT_RUST_HOST_PREFIX:-}" ]; then
            for cand in "$base/$ENACT_RUST_HOST_PREFIX"*; do
              [ -d "$cand" ] || continue
              case "$cand" in *.new.*|*.old.*) continue ;; esac
              if [ -z "$seeded" ] || [ "$cand" -nt "$seeded" ]; then
                seeded="$cand"
              fi
            done
            if [ -n "$seeded" ]; then
              src="$seeded"
            fi
          fi
          if [ -d "$src" ]; then
            mkdir -p "$ENACT_RUST_TARGET"
            cp -a --reflink=auto "$src/." "$ENACT_RUST_TARGET/"
            touch "$src"
            if [ -n "$seeded" ]; then
              echo "Seeded $ENACT_RUST_TARGET from host cache ($(basename "$src"))"
            else
              echo "Restored $ENACT_RUST_TARGET from the host cache"
            fi
          else
            echo "No host-cached $ENACT_RUST_TARGET yet"
          fi
        env:
          ENACT_RUST_HOST_KEY: ${{ runner.os }}-rust-cli_target-${{ hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}
          ENACT_RUST_HOST_PREFIX: ${{ runner.os }}-rust-cli_target-${{ hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock') }}-
          ENACT_RUST_TARGET: cli/target
      - name: Restore Rust target & cargo cache [rust/target]
        id: rust_l1_cache_rust_target
        if: ${{ (hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',rust/target,') && steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}-${{ github.sha }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          restore-keys: |-
            ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}-
            ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}-
      - name: Restore Rust target & cargo cache [rust/target] from the Host Cache
        if: ${{ (hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',rust/target,') && steps.runner_caches.outputs.host != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        run: |-
          base="$ENACT_HOST_CACHE/repo/cargo-target"
          src="$base/$ENACT_RUST_HOST_KEY"
          seeded=""
          if [ ! -d "$src" ] && [ -n "${ENACT_RUST_HOST_PREFIX:-}" ]; then
            for cand in "$base/$ENACT_RUST_HOST_PREFIX"*; do
              [ -d "$cand" ] || continue
              case "$cand" in *.new.*|*.old.*) continue ;; esac
              if [ -z "$seeded" ] || [ "$cand" -nt "$seeded" ]; then
                seeded="$cand"
              fi
            done
            if [ -n "$seeded" ]; then
              src="$seeded"
            fi
          fi
          if [ -d "$src" ]; then
            mkdir -p "$ENACT_RUST_TARGET"
            cp -a --reflink=auto "$src/." "$ENACT_RUST_TARGET/"
            touch "$src"
            if [ -n "$seeded" ]; then
              echo "Seeded $ENACT_RUST_TARGET from host cache ($(basename "$src"))"
            else
              echo "Restored $ENACT_RUST_TARGET from the host cache"
            fi
          else
            echo "No host-cached $ENACT_RUST_TARGET yet"
          fi
        env:
          ENACT_RUST_HOST_KEY: ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}
          ENACT_RUST_HOST_PREFIX: ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-
          ENACT_RUST_TARGET: rust/target
    - name: Record Restored Package Caches
      if: ${{ ((steps.runner_caches.outputs.host == '' && steps.python_l1_cache.outputs.cache-hit != 'true' || steps.runner_caches.outputs.host == '' && steps.node_l1_cache.outputs.cache-hit != 'true') && github.event_name != 'pull_request') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact ci cache-delta record
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache .enact/state/pnpm-cache
          node_l1_cache node_modules/.cache
        ENACT_CACHE_HITS: |-
          python_l1_cache=${{ steps.python_l1_cache.outputs.cache-hit }}
          node_l1_cache=${{ steps.node_l1_cache.outputs.cache-hit }}
    - name: Pull Dependencies via enve
      if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact ci deps pull --remote signed
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID || env.R2_READ_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY || env.R2_READ_SECRET_ACCESS_KEY }}
        ENACT_ENVIRONMENT_DIRS: "[\".\",\"bin/hobby-installer\",\"cli\",\"livestream\",\"nodejs\",\"products/desktop\",\"proto\",\"rust\",\"services/agent-proxy\",\"services/mcp\",\"services/oauth-proxy\",\"tools/phrocs\"]"
        ENACT_ENVIRONMENT_FILES: "[]"
        ENACT_JOB_SERVICES: ""
        ENACT_PREPARE_ENVIRONMENT_FILES: "[\"enve.cue\"]"
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Check enve Stores into the Host Cache
      if: ${{ (steps.runner_caches.outputs.host != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact ci check-store
    - name: Install Project Dependencies
      if: ${{ (hashFiles('package.json') != '' && steps.stage_plan.outputs.stage_needs_node == 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact ci deps install node --manager pnpm
      env:
        ENACT_ENVIRONMENT_FILE: enve.cue
    - name: Install Python Dependencies
      id: python_install
      if: ${{ (hashFiles('pyproject.toml', 'requirements.txt') != '' && steps.stage_plan.outputs.stage_needs_python == 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact ci deps install python --manager uv
      env:
        ENACT_ENVIRONMENT_FILE: enve.cue
        ENACT_PYTHON_INSTALL: bash showcase/scripts/setup.sh backend
        UV_HTTP_RETRIES: "5"
        UV_HTTP_TIMEOUT: "120"
    - name: Verify Pipeline Contracts (enact check --contracts)
      run: |-
        ENACT_BIN=""
        if command -v enact >/dev/null 2>&1; then
          ENACT_BIN="enact"
        elif [ -x "bin/enact" ]; then
          ENACT_BIN="bin/enact"
        fi
        if [ -n "$ENACT_BIN" ]; then
          echo "🔬 Running enact check --contracts..."
          $ENACT_BIN check --contracts --pipeline .enact --workflow ci
        fi
    - name: Execute Stage [Preflight]
      if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: |-
        RESOLVED=$(enact ci resolve-base) || exit
        eval "$RESOLVED"
        enact run --pipeline .enact --workflow ci "$@" --stage preflight
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID || env.R2_READ_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY || env.R2_READ_SECRET_ACCESS_KEY }}
        ENACT_BASE_REF: ${{ inputs.base_ref || github.base_ref || github.event.pull_request.base.ref }}
        ENACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ENACT_CACHE_WRITE: read_only
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        ENACT_EVENT_BEFORE: ${{ github.event.before }}
        ENACT_FORCE_NO_CACHE: ${{ inputs.no_cache == 'true' || vars.ENACT_NO_CACHE == 'true' || contains(github.event.pull_request.title, '[no-cache]') || contains(github.event.pull_request.body, '[no-cache]') || contains(github.event.pull_request.labels.*.name, 'no-cache') }}
        ENACT_FORCE_RERUN: ${{ contains(github.event.pull_request.title, '[rerun]') || contains(github.event.pull_request.body, '[rerun]') || contains(github.event.pull_request.labels.*.name, 'rerun') || contains(github.event.pull_request.labels.*.name, 'showcase') || startsWith(github.head_ref, 'showcase/') || startsWith(github.ref_name, 'showcase/') }}
        ENACT_INPUT_ALL: ${{ inputs.all }}
        ENACT_INPUT_FILES: ${{ inputs.files }}
        ENACT_INPUT_UPDATED: ${{ inputs.updated }}
        ENACT_INTEGRATION_BRANCH: ${{ vars.ENACT_INTEGRATION_BRANCH }}
        ENACT_PIN_DIFF_SHA256: ${{ inputs.pin_diff_sha256 }}
        ENACT_PIN_HISTORY_SHA256: ${{ inputs.pin_history_sha256 }}
        ENACT_PIN_REACH_AGE_SHA256: ${{ inputs.pin_reach_age_sha256 }}
        ENACT_PIN_REACH_MAP_SHA256: ${{ inputs.pin_reach_map_sha256 }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_REACH_PULLED: "1"
        ENACT_RUNNER_ALLOCATION: "{\"cpus\":6.0,\"memory_mb\":5120,\"runtime_reserve_mb\":2048}"
        ENACT_SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - name: Diagnose Cgroup OOM on Failure
      if: ${{ failure() }}
      run: |-
        if [ -r /sys/fs/cgroup/memory.events ]; then
        oom=$(awk '$1 == "oom_kill" { print $2 }' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
        peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unknown)
        limit=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)
        echo "cgroup memory: oom_kill=${oom:-0} peak=${peak} max=${limit}"
        if [ "${oom:-0}" -gt 0 ] 2>/dev/null; then
        echo "::error::Container cgroup OOM-killed a process (oom_kill=${oom}, memory.peak=${peak}, memory.max=${limit})"
        fi
        fi
    - name: Diagnose Disk & Btrfs Qgroup on Failure
      if: ${{ failure() }}
      run: |-
        df -h || true
        df -i || true
        btrfs qgroup show -reF / 2>/dev/null || true
    - name: Log Cgroup Memory & PSI Telemetry
      if: ${{ always() }}
      run: |-
        if [ -d /sys/fs/cgroup ]; then
        anon=$(awk '$1 == "anon" { print $2 }' /sys/fs/cgroup/memory.stat 2>/dev/null || echo unknown)
        kernel=$(awk '$1 == "kernel" { print $2 }' /sys/fs/cgroup/memory.stat 2>/dev/null || echo unknown)
        peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unknown)
        limit=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)
        high=$(awk '$1 == "high" { print $2 }' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
        max_ev=$(awk '$1 == "max" { print $2 }' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
        oom=$(awk '$1 == "oom_kill" { print $2 }' /sys/fs/cgroup/memory.events 2>/dev/null || echo 0)
        sampled=$(cat "${GHA_ANON_PEAK_FILE:-/dev/null}" 2>/dev/null || true)
        [ -n "$sampled" ] || sampled="nonreclaim_peak_sampled=unknown"
        psi=$(tr '\n' ' ' < /sys/fs/cgroup/memory.pressure 2>/dev/null || echo unavailable)
        echo "cgroup telemetry: anon=${anon} kernel=${kernel} peak=${peak} max=${limit} events(high=${high:-0},max=${max_ev:-0},oom_kill=${oom:-0}) ${sampled} psi=${psi}"
        fi
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ (!cancelled() && (steps.runner_caches.outputs.host == '' && steps.python_l1_cache.outputs.cache-hit != 'true' || steps.runner_caches.outputs.host == '' && steps.node_l1_cache.outputs.cache-hit != 'true') && env.ENACT_SAVE_EVENT == 'true' && github.event_name != 'pull_request') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact ci cache-delta check
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache .enact/state/pnpm-cache
          node_l1_cache node_modules/.cache
        ENACT_CACHE_HITS: |-
          python_l1_cache=${{ steps.python_l1_cache.outputs.cache-hit }}
          node_l1_cache=${{ steps.node_l1_cache.outputs.cache-hit }}
        ENACT_UV_PRUNE: ${{ steps.stage_plan.outputs.stage_needs_python == 'true' && steps.python_l1_cache.outputs.cache-hit != 'true' }}
    - name: Save Python build & venv cache
      if: ${{ ((!cancelled() && (success() || steps.python_install.outcome == 'success') && (env.ENACT_SAVE_EVENT == 'true' && steps.stage_plan.outputs.stage_needs_python == 'true' && hashFiles('pyproject.toml', 'requirements.txt') != '' && steps.runner_caches.outputs.host == '' && steps.cache_delta.outputs.python_l1_cache == 'true')) && github.event_name != 'pull_request' && steps.python_l1_cache.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.python_l1_cache.outputs.cache-primary-key }}
        path: |-
          /tmp/.cache/uv
          /tmp/.cache/pip
    - name: Prune Rust caches before saving
      id: prune_cargo
      if: ${{ ((success() || !cancelled() && steps.runner_caches.outputs.host != '') && env.ENACT_SAVE_EVENT == 'true' && fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact cache prune-cargo --pipeline .enact
    - name: Check Rust target & cargo cache [cli/target] size limit (<= 1.5 GiB)
      id: rust_l1_cache_cli_target_size_guard
      if: ${{ (env.ENACT_SAVE_EVENT == 'true' && hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',cli/target,') && steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: |-
        total_kb=$(du -sk "$ENACT_RUST_TARGET" 2>/dev/null | awk '{print $1}')
        total_kb="${total_kb:-0}"
        if [ "$total_kb" -le 1572864 ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Skipping GitHub cache save for $ENACT_RUST_TARGET (${total_kb} KiB > 1572864 KiB / 1.5 GiB limit)"
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        ENACT_RUST_HOST_KEY: ${{ runner.os }}-rust-cli_target-${{ hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}
        ENACT_RUST_TARGET: cli/target
    - name: Check Rust target & cargo cache [rust/target] size limit (<= 1.5 GiB)
      id: rust_l1_cache_rust_target_size_guard
      if: ${{ (env.ENACT_SAVE_EVENT == 'true' && hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',rust/target,') && steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: |-
        total_kb=$(du -sk "$ENACT_RUST_TARGET" 2>/dev/null | awk '{print $1}')
        total_kb="${total_kb:-0}"
        if [ "$total_kb" -le 1572864 ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Skipping GitHub cache save for $ENACT_RUST_TARGET (${total_kb} KiB > 1572864 KiB / 1.5 GiB limit)"
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        ENACT_RUST_HOST_KEY: ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}
        ENACT_RUST_TARGET: rust/target
    - parallel:
      - name: Save Node dependency cache
        if: ${{ ((env.ENACT_SAVE_EVENT == 'true' && steps.stage_plan.outputs.stage_needs_node == 'true' && steps.cache_delta.outputs.node_l1_cache == 'true' && steps.runner_caches.outputs.host == '') && github.event_name != 'pull_request' && steps.node_l1_cache.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.node_l1_cache.outputs.cache-primary-key }}
          path: |-
            .enact/state/pnpm-store
            .enact/state/pnpm-cache
            node_modules/.cache
      - name: Save Rust target & cargo cache [cli/target]
        if: ${{ (((env.ENACT_SAVE_EVENT == 'true' && hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',cli/target,') && steps.runner_caches.outputs.host == '' && steps.rust_l1_cache_cli_target_size_guard.outputs.ok == 'true') && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.rust_l1_cache_cli_target.outputs.cache-matched-key, format('{0}-rust-cli_target-{1}-{2}-{3}-', runner.os, hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock'), fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache, hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml'))))) && github.event_name != 'pull_request' && steps.rust_l1_cache_cli_target.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.rust_l1_cache_cli_target.outputs.cache-primary-key }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
      - name: Save Rust target & cargo cache [cli/target] to the Host Cache
        if: ${{ (!cancelled() && env.ENACT_SAVE_EVENT == 'true' && hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',cli/target,') && steps.runner_caches.outputs.host != '' && steps.prune_cargo.outcome == 'success') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        run: |-
          [ -d "$ENACT_RUST_TARGET" ] || exit 0
          has_fp=0
          for fp in "$ENACT_RUST_TARGET"/*/.fingerprint "$ENACT_RUST_TARGET"/*/*/.fingerprint; do
            if [ -d "$fp" ]; then
              has_fp=1
              break
            fi
          done
          [ "$has_fp" = 1 ] || exit 0
          dst="$ENACT_HOST_CACHE/repo/cargo-target/$ENACT_RUST_HOST_KEY"
          tmp="$dst.new.$$"
          mkdir -p "$(dirname "$dst")"
          rm -rf "$tmp"
          cp -a --reflink=auto "$ENACT_RUST_TARGET/." "$tmp/"
          if [ -d "$dst" ]; then mv "$dst" "$dst.old.$$"; fi
          mv "$tmp" "$dst"
          rm -rf "$dst.old.$$"
          echo "Saved $ENACT_RUST_TARGET to the host cache ($(du -sh "$dst" | cut -f1))"
        env:
          ENACT_RUST_HOST_KEY: ${{ runner.os }}-rust-cli_target-${{ hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}
          ENACT_RUST_TARGET: cli/target
      - name: Save Rust target & cargo cache [rust/target]
        if: ${{ (((env.ENACT_SAVE_EVENT == 'true' && hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',rust/target,') && steps.runner_caches.outputs.host == '' && steps.rust_l1_cache_rust_target_size_guard.outputs.ok == 'true') && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.rust_l1_cache_rust_target.outputs.cache-matched-key, format('{0}-rust-rust_target-{1}-{2}-{3}-', runner.os, hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock'), fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache, hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml'))))) && github.event_name != 'pull_request' && steps.rust_l1_cache_rust_target.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.rust_l1_cache_rust_target.outputs.cache-primary-key }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
      - name: Save Rust target & cargo cache [rust/target] to the Host Cache
        if: ${{ (!cancelled() && env.ENACT_SAVE_EVENT == 'true' && hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',rust/target,') && steps.runner_caches.outputs.host != '' && steps.prune_cargo.outcome == 'success') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        run: |-
          [ -d "$ENACT_RUST_TARGET" ] || exit 0
          has_fp=0
          for fp in "$ENACT_RUST_TARGET"/*/.fingerprint "$ENACT_RUST_TARGET"/*/*/.fingerprint; do
            if [ -d "$fp" ]; then
              has_fp=1
              break
            fi
          done
          [ "$has_fp" = 1 ] || exit 0
          dst="$ENACT_HOST_CACHE/repo/cargo-target/$ENACT_RUST_HOST_KEY"
          tmp="$dst.new.$$"
          mkdir -p "$(dirname "$dst")"
          rm -rf "$tmp"
          cp -a --reflink=auto "$ENACT_RUST_TARGET/." "$tmp/"
          if [ -d "$dst" ]; then mv "$dst" "$dst.old.$$"; fi
          mv "$tmp" "$dst"
          rm -rf "$dst.old.$$"
          echo "Saved $ENACT_RUST_TARGET to the host cache ($(du -sh "$dst" | cut -f1))"
        env:
          ENACT_RUST_HOST_KEY: ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}
          ENACT_RUST_TARGET: rust/target
    - name: Upload Telemetry [telemetry-stage-preflight]
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-stage-preflight
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
          .enact/state/nodejs/*.services.log
          .enact/state/e2e/shard-*/failed/**
          .enact/state/e2e/shard-*/run/test-results/**
          playwright/test-results/**
        retention-days: "1"
  seed-frontend-typecheck:
    name: "Seed caches: Frontend typecheck"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        target_sha="$GITHUB_SHA"
        scored_control=0
        if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${ENACT_CONTROL_PIN_REQUIRED:-}" = "true" ]; then
            scored_control=1
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            if [ "$scored_control" -ne 1 ]; then
                echo "::error::control_checkout_sha override is refused outside scored-control workflow_dispatch (control_pin_required=true)" >&2
                exit 1
            fi
            case "$ENACT_CONTROL_CHECKOUT_SHA" in
                *[!0-9a-fA-F]*)
                    echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                    exit 1
                    ;;
            esac
            if [ "${#ENACT_CONTROL_CHECKOUT_SHA}" -ne 40 ]; then
                echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                exit 1
            fi
            target_sha="$ENACT_CONTROL_CHECKOUT_SHA"
        elif [ "$scored_control" -eq 1 ]; then
            echo "::error::scored-control dispatch requires non-empty control_checkout_sha" >&2
            exit 1
        fi
        export GIT_CONFIG_COUNT=2
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        export GIT_CONFIG_KEY_1=safe.directory
        export GIT_CONFIG_VALUE_1="$mirror"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        base_ref="${GITHUB_BASE_REF:-${ENACT_BASE_REF:-}}"
        depth="${ENACT_HOST_FETCH_DEPTH:-50}"
        fetch_args=(--no-tags)
        if [ "$depth" != "0" ]; then
            fetch_args+=("--depth=$depth")
        fi
        refs=()
        case "${GITHUB_REF:-}" in
            refs/heads/*|refs/pull/*|refs/tags/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        if [ -n "$base_ref" ] && [ "refs/heads/$base_ref" != "${GITHUB_REF:-}" ]; then
            refs+=("+refs/heads/$base_ref:refs/heads/$base_ref")
        fi
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            ref_current=""
            case "${GITHUB_REF:-}" in
                refs/heads/*|refs/pull/*|refs/tags/*) ref_current=$(git -C "$mirror" rev-parse --verify -q "$GITHUB_REF^{commit}" 2>/dev/null || true) ;;
                *) ref_current="$target_sha" ;;
            esac
            base_missing=0
            if [ -n "$base_ref" ] && ! git -C "$mirror" rev-parse --verify -q "refs/heads/$base_ref^{commit}" >/dev/null 2>&1; then
                base_missing=1
            fi
            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$target_sha" ] || [ "$base_missing" = 1 ] || ! git -C "$mirror" cat-file -e "$target_sha^{commit}" 2>/dev/null; then
                if [ "${#refs[@]}" -gt 0 ]; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "${refs[@]}" \
                        || git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "$target_sha"
                else
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "$target_sha"
                fi
                if ! git -C "$mirror" cat-file -e "$target_sha^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "$target_sha"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        mirror_branches=()
        case "${GITHUB_REF:-}" in
            refs/heads/*) mirror_branches+=("${GITHUB_REF#refs/heads/}") ;;
        esac
        if [ -n "$base_ref" ] && [ "refs/heads/$base_ref" != "${GITHUB_REF:-}" ]; then
            mirror_branches+=("$base_ref")
        fi
        if [ "${#mirror_branches[@]}" -gt 0 ]; then
            for ref_branch in "${mirror_branches[@]}"; do
                ref_sha=$(git -C "$mirror" rev-parse --verify -q "refs/heads/$ref_branch^{commit}" 2>/dev/null || true)
                if [ -n "$ref_sha" ]; then
                    git update-ref "refs/remotes/origin/$ref_branch" "$ref_sha"
                fi
            done
        fi
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            raw_cone=()
            while IFS= read -r entry; do
                entry="${entry#"${entry%%[![:space:]]*}"}"
                entry="${entry%"${entry##*[![:space:]]}"}"
                [ -n "$entry" ] && raw_cone+=("$entry")
            done <<<"$ENACT_SPARSE_CONE"
            cone=()
            to_check=()
            if [ "${#raw_cone[@]}" -gt 0 ]; then
                for entry in "${raw_cone[@]}"; do
                    case "$entry" in
                        */.enact-direct-files)
                            cone+=("$entry")
                            ;;
                        *)
                            to_check+=("$entry")
                            ;;
                    esac
                done
            fi
            if [ "${#to_check[@]}" -gt 0 ]; then
                idx=0
                while IFS= read -r kind; do
                    entry="${to_check[$idx]}"
                    idx=$((idx + 1))
                    if [ "$kind" = "blob" ]; then
                        case "$entry" in
                            */*) cone+=("${entry%/*}/.enact-direct-files") ;;
                        esac
                    else
                        cone+=("$entry")
                    fi
                done < <(
                    for entry in "${to_check[@]}"; do
                        printf '%s:%s\n' "${target_sha:-$GITHUB_SHA}" "$entry"
                    done | git cat-file --batch-check='%(objecttype)'
                )
            fi
            if [ "${#cone[@]}" -gt 0 ]; then
                git sparse-checkout set --cone "${cone[@]}"
            fi
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            git checkout -q --force --detach "$target_sha"
        else
            case "${GITHUB_REF:-}" in
                refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$target_sha" ;;
                *) git checkout -q --force --detach "$target_sha" ;;
            esac
        fi
        checked_commit=$(git rev-parse HEAD)
        checked_tree=$(git rev-parse "HEAD^{tree}")
        if [ "$checked_commit" != "$target_sha" ]; then
            echo "::error::host checkout commit mismatch: expected $target_sha, got $checked_commit" >&2
            exit 1
        fi
        echo "Checked out $checked_commit (tree $checked_tree) through the host mirror"
      env:
        ENACT_CONTROL_CHECKOUT_SHA: ${{ inputs.control_checkout_sha }}
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          showcase
          patches
          tools/hogli
          packages/owners-yaml
          packages/personhog-proto
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          turbo.json
          tsconfig.json
          tsconfig.dev.json
          tsconfig.kea-typegen.json
          .oxfmtrc.json
          .oxlintrc.json
          .prettierignore
          .stylelintrc.js
          .stylelintignore
          .nvmrc
          .kearc
          postcss.config.js
          pyproject.toml
          uv.lock
          conftest.py
          pytest.ini
          pytest_boot_gc.py
          .test_quarantine.json
          manage.py
          hogli.yaml
