# Generated by enact from .enact; edit the pipeline and run `enact transpile`.
name: posthog-platform
on:
  push:
    branches:
    - master
    - main
    - perf/ci-modernization
    - perf/ci-showcase
    - showcase/**
    paths:
    - "**/*"
  pull_request:
    branches:
    - master
    - main
    - perf/ci-modernization
    - perf/ci-showcase
    - showcase/**
  workflow_dispatch:
    inputs:
      all:
        description: Force execution of all components regardless of git changes
        required: false
        default: "false"
      base_ref:
        description: Target base branch for diff detection (e.g. main, master, a release branch)
        required: false
      files:
        description: File(s) to plan as changed instead of the git diff, comma-separated (e.g. one test file)
        required: false
      no_cache:
        description: Disable task cache, forcing full execution
        required: false
        default: "false"
      seed_caches:
        description: Run the jobs of seeded caches cold and save the caches (on the default branch)
        required: false
        default: "false"
      updated:
        description: Component(s) to emulate as updated
        required: false
      warm_reach:
        description: Run every suite and record each test without a fresh reach footprint (on the default branch, after an enact upgrade)
        required: false
        default: "false"
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  CARGO_INCREMENTAL: "0"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  ENVE_SERVICE_GID: "1000"
  ENVE_SERVICE_UID: "1000"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOCACHE: /tmp/go-build
  GOPATH: /tmp/go
  UV_CACHE_DIR: /tmp/.cache/uv
  XDG_CACHE_HOME: /tmp/.cache
jobs:
  build-outputs:
    name: Build Outputs (${{ matrix.component }})
    needs:
    - detect
    if: ${{ needs.detect.outputs.builds != '{"include":[]}' && needs.detect.outputs.builds != '[]' && needs.detect.outputs.builds != '' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.detect.outputs.builds) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    steps:
    - name: Look Up Built Outputs
      id: outputs-lookup
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        lookup-only: "true"
        path: ${{ matrix.output_paths }}
    - name: Probe Runner Caches
      id: runner_caches
      if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
      run: |
        #!/usr/bin/env bash
        # The runner's host cache: `ENACT_HOST_CACHE` names a directory the host mounts read-write
        # into every job and keeps across jobs. `repo/` holds this repository's stores; `shared/`,
        # seen by every repository the host serves, holds only signature-verified content: the enve
        # NAR mirror (`ENVE_MIRROR`), which enve reads first and fills with the paths it pulled and
        # verified (signed by cache.nixos.org or a key in `ENVE_TRUSTED_PUBLIC_KEYS`); a tampered
        # entry fails verification and enve falls back to the next substituter. Concurrent jobs share both: enve, uv, pnpm and Go lock their
        # own stores, and the git mirror is fetched under a lock. The host drops the least recently
        # used entries under `repo/` and `shared/` whole, so each store owns one, touched on every use.
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        # enve's trust check of a store directory, which it otherwise leaves for a fallback store
        # without a word: from `/` down, each component owned by root or the user and writable by
        # no one else, a root-owned sticky ancestor excepted.
        trusted_store() {
            local path="" part owner mode uid
            uid=$(id -u)
            IFS=/ read -ra parts <<<"${1#/}"
            for part in "${parts[@]}"; do
                path="$path/$part"
                read -r owner mode < <(stat -c '%u %a' "$path" 2>/dev/null || stat -f '%u %Mp%Lp' "$path")
                mode=$((8#$mode))
                [ "$owner" = 0 ] || [ "$owner" = "$uid" ] || return 1
                if (( mode & 8#22 )); then
                    [ "$owner" = 0 ] && (( mode & 8#1000 )) && [ "$path" != "$1" ] || return 1
                fi
            done
        }
        # The layout, one line per store: `<variable> <entry> <path under the entry>`; the git mirror
        # names a repository, every other path a directory.
        layout() {
            cat <<LAYOUT
        ENVE_STORE_DIR repo/enve-store .
        UV_CACHE_DIR repo/uv .
        PIP_CACHE_DIR repo/pip .
        ENACT_PNPM_STORE repo/pnpm .
        npm_config_cache repo/npm .
        YARN_CACHE_FOLDER repo/yarn .
        BUN_INSTALL_CACHE_DIR repo/bun .
        GOMODCACHE repo/go mod
        GOCACHE repo/go build
        ENACT_GIT_MIRROR repo/git ${GITHUB_REPOSITORY##*/}.git
        ENVE_MIRROR shared/enve-nar .
        LAYOUT
        }
        if [ -n "$host" ]; then
            # The repository's stores are writable by no one else: enve trusts no other store.
            # `shared/` stays as the host made it, writable by the jobs of every repository.
            umask 022
            chmod go-w "$host/repo" 2>/dev/null || true
            # The enve store check reads what enve wrote since.
            touch "${RUNNER_TEMP:-/tmp}/enact-host-cache.stamp"
            while read -r var entry path; do
                # The host provides `shared/`; without it the NAR mirror is skipped.
                { [ -d "$host/${entry%%/*}" ] && [ -w "$host/${entry%%/*}" ]; } || continue
                mkdir -p "$host/$entry"
                touch "$host/$entry"
                dir="$host/$entry/$path"
                case "$var" in
                    ENACT_GIT_MIRROR) ;;
                    *) mkdir -p "$dir" ;;
                esac
                dir="${dir%/.}"
                if [ "${entry%%/*}" = repo ]; then
                    chmod 755 "$host/$entry" 2>/dev/null || true
                    [ ! -d "$dir" ] || chmod 755 "$dir" 2>/dev/null || true
                fi
                if [ "$var" = ENVE_STORE_DIR ] && ! trusted_store "$dir"; then
                    echo "::error::enve won't trust $dir (an owner other than $(id -un) or root, or writable by others, on the way from /) and would store elsewhere: fix the host cache's ownership and modes"
                    exit 1
                fi
                [ "$var" != ENVE_MIRROR ] || dir="file://$dir"
                echo "$var=$dir" >> "$GITHUB_ENV"
            done < <(layout)
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ (steps.runner_caches.outputs.host != '') && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: |
        #!/usr/bin/env bash
        # Checks the commit out through the host cache's mirror of the repository
        # (`ENACT_GIT_MIRROR`, from the runner cache probe): the mirror fetches what it lacks under its
        # lock, and the work tree borrows its objects (alternates), so the checkout has the whole
        # history at the cost of a few new commits. `ENACT_SPARSE_CONE`: the cone's directories,
        # one per line; none checks the whole tree out.
        set -euo pipefail
        git config --global --add safe.directory "*"
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        refs=("+refs/heads/*:refs/heads/*")
        case "$GITHUB_REF" in
            refs/pull/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags --prune "$url" "${refs[@]}"
            if ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags "$url" "$GITHUB_SHA"
            fi
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        # A half-made repository would mislead the fallback checkout into reusing it.
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        # A fresh work tree, as actions/checkout leaves one: nothing of an earlier job survives.
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        git fetch -q --no-tags "$mirror" "+refs/heads/*:refs/remotes/origin/*"
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            mapfile -t cone < <(printf '%s\n' "$ENACT_SPARSE_CONE" | sed '/^[[:space:]]*$/d')
            git sparse-checkout set --cone "${cone[@]}"
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H through the host mirror'
      env:
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: ${{ matrix.sparse_checkout }}
    - name: Checkout Repository (sparse)
      if: ${{ (matrix.sparse_checkout != '' && (steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure')) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: ${{ matrix.sparse_checkout }}
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Checkout Repository (full)
      if: ${{ (matrix.sparse_checkout == '' && (steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure')) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        submodules: "false"
    - name: Install committed enact & enve builds
      if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
      run: |
        # The repository's committed enact, enve and bubblewrap builds: bin/<os>-<arch>/ for this runner
        # (bin/linux-x86_64/, bin/linux-aarch64/), else bin/. They're copied to ~/.cargo/bin,
        # which goes ahead of bin/ on PATH, so the runner's own build wins over bin/'s. A build for
        # another CPU (an x86_64 enve on an arm64 runner) is never installed: enact or enve fails
        # here, naming the directory to commit, instead of the first step that runs it.
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        # Whether this runner can execute $1: false only for an ELF of another CPU or OS.
        runs_here() {
          local header
          header="$(od -An -tx1 -N20 "$1" 2>/dev/null | tr -d ' \n')"
          [ "${header:0:8}" = 7f454c46 ] || return 0
          case "$PLATFORM:${header:36:4}" in
            linux-x86_64:3e00 | linux-aarch64:b700) return 0 ;;
          esac
          return 1
        }
        mkdir -p "$HOME/.cargo/bin"
        if [ -d "$BIN_DIR" ]; then
          for b in enact enve bwrap; do
            src="$BIN_DIR/$b"
            if [ -f "$BIN_DIR/$PLATFORM/$b" ]; then
              src="$BIN_DIR/$PLATFORM/$b"
            fi
            [ -f "$src" ] || continue
            if ! runs_here "$src"; then
              if [ "$b" = bwrap ]; then
                echo "::warning::bin/$b is a build for another CPU than this $PLATFORM runner: not installed"
                continue
              fi
              echo "::error title=No $b for $PLATFORM::bin/$b is a build for another CPU; commit this runner's as bin/$PLATFORM/$b"
              exit 1
            fi
            chmod +x "$src" 2>/dev/null || true
            cp -f "$src" "$HOME/.cargo/bin/$b"
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Ensure enve & enact CLI on PATH
      if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
      run: |
        git config --global --add safe.directory "*" 2>/dev/null || true
        # The store the runner cache probe chose (a host cache's), else the user store.
        store="${ENVE_STORE_DIR:-$HOME/.local/share/enve/store}"
        mkdir -p "$store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$store" /nix/store 2>/dev/null || true
        fi
        # The previous step's $GITHUB_PATH entries apply from the next step on.
        export PATH="$HOME/.cargo/bin:${GITHUB_WORKSPACE:-$PWD}/bin:$PATH"
        # Isolation as on a Linux workstation: with bubblewrap on PATH (e.g. the repository's
        # bin/bwrap), enve sandboxes commands and services and maps the profile's hosts inside.
        # GitHub's Ubuntu runners restrict unprivileged user namespaces (AppArmor), which bwrap
        # needs; the VM is disposable, so lift that. Without a working bwrap, enve runs on the host:
        # its profile's host aliases go to the runner's /etc/hosts instead.
        if command -v bwrap >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 \
          && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if command -v bwrap >/dev/null 2>&1 && bwrap --bind / / true 2>/dev/null; then
          echo "enve isolation: $(bwrap --version)"
        elif command -v sudo >/dev/null 2>&1 && command -v enve >/dev/null 2>&1 && [ -f enve.cue ]; then
          enve cue export -q -e profiles.dev.hosts enve.cue 2>/dev/null \
            | jq -r 'to_entries[] | "\(.value) \(.key)"' 2>/dev/null \
            | sudo tee -a /etc/hosts >/dev/null || true
        fi
    - parallel:
      - name: Restore enact Task CAS Cache
        id: enact-tasks-cache
        if: ${{ steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
          path: .enact/state/cache
          restore-keys: ${{ runner.os }}-enact-tasks-
      - name: Restore Python build & venv cache
        id: python_l1_cache
        if: ${{ (hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') != '' && contains(matrix.technology, 'python') && steps.runner_caches.outputs.host == '') && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-python-${{ hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') }}
          path: |-
            /tmp/.cache/uv
            /tmp/.cache/pip
          restore-keys: ${{ runner.os }}-python-
      - name: Restore Go build cache
        id: go_l1_cache
        if: ${{ (hashFiles('**/go.mod', '**/go.sum') != '' && contains(matrix.technology, 'go') && steps.runner_caches.outputs.host == '') && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}-${{ github.sha }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
          restore-keys: |-
            ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}-
            ${{ runner.os }}-go-
      - name: Restore Rust target & cargo cache [cli/target]
        id: rust_l1_cache_cli_target
        if: ${{ (hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') != '' && contains(format(',{0},', matrix.cargo_targets), ',cli/target,')) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-rust-cli_target-${{ hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock') }}-${{ matrix.cargo_cache }}-${{ hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') }}-${{ github.sha }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
          restore-keys: |-
            ${{ runner.os }}-rust-cli_target-${{ hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock') }}-${{ matrix.cargo_cache }}-${{ hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') }}-
            ${{ runner.os }}-rust-cli_target-${{ hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock') }}-${{ matrix.cargo_cache }}-
      - name: Restore Rust target & cargo cache [funnel-udf/target]
        id: rust_l1_cache_funnel_udf_target
        if: ${{ (hashFiles('funnel-udf/Cargo.lock', 'funnel-udf/**/Cargo.toml') != '' && contains(format(',{0},', matrix.cargo_targets), ',funnel-udf/target,')) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-rust-funnel_udf_target-${{ hashFiles('enve.lock', 'funnel-udf/rust-toolchain.toml', 'funnel-udf/rust-toolchain', 'funnel-udf/enve.lock') }}-${{ matrix.cargo_cache }}-${{ hashFiles('funnel-udf/Cargo.lock', 'funnel-udf/**/Cargo.toml') }}-${{ github.sha }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            funnel-udf/target
          restore-keys: |-
            ${{ runner.os }}-rust-funnel_udf_target-${{ hashFiles('enve.lock', 'funnel-udf/rust-toolchain.toml', 'funnel-udf/rust-toolchain', 'funnel-udf/enve.lock') }}-${{ matrix.cargo_cache }}-${{ hashFiles('funnel-udf/Cargo.lock', 'funnel-udf/**/Cargo.toml') }}-
            ${{ runner.os }}-rust-funnel_udf_target-${{ hashFiles('enve.lock', 'funnel-udf/rust-toolchain.toml', 'funnel-udf/rust-toolchain', 'funnel-udf/enve.lock') }}-${{ matrix.cargo_cache }}-
      - name: Restore Rust target & cargo cache [rust/target]
        id: rust_l1_cache_rust_target
        if: ${{ (hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') != '' && contains(format(',{0},', matrix.cargo_targets), ',rust/target,')) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-${{ matrix.cargo_cache }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}-${{ github.sha }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          restore-keys: |-
            ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-${{ matrix.cargo_cache }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}-
            ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-${{ matrix.cargo_cache }}-
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: ${{ ((contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node')) && steps.runner_caches.outputs.host == '') && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v2-${{ matrix.task_id }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
          restore-keys: |-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-${{ matrix.task_id }}-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-
      - name: Restore Cache [Backend database templates]
        id: cache_backend_templates
        if: ${{ (contains(format(',{0},', matrix.caches), ',backend-templates,')) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: backend-templates-4-${{ runner.os }}-${{ github.sha }}
          path: ~/.cache/enact/snapshots/v3
          restore-keys: backend-templates-4-${{ runner.os }}-
      - name: Restore Cache [frontend tsgo declaration-emit cache]
        id: cache_frontend_tsgo
        if: ${{ (contains(format(',{0},', matrix.caches), ',frontend-tsgo,')) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: frontend-tsgo-${{ runner.os }}-${{ github.sha }}
          path: .enact/state/tsgo
          restore-keys: frontend-tsgo-${{ runner.os }}-
      - name: Restore Cache [mypy fine-grained cache]
        id: cache_mypy
        if: ${{ (contains(format(',{0},', matrix.caches), ',mypy,')) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: mypy-${{ runner.os }}-${{ github.sha }}
          path: .mypy_cache
          restore-keys: mypy-${{ runner.os }}-
    - name: Record Restored Package Caches
      if: ${{ (steps.runner_caches.outputs.host == '') && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: |
        # ENACT_CACHE_DELTA: one `<cache id> <path>` line per cached path.
        delta_dir="${RUNNER_TEMP:-/tmp}/enact-cache-delta"
        delta_ids() { awk 'NF { print $1 }' <<<"$ENACT_CACHE_DELTA" | sort -u; }
        # The entries under the cache's paths (dot entries pruned: locks and temporaries), sorted.
        delta_list() {
            local want="$1" id path
            while read -r id path; do
                [ "$id" = "$want" ] || continue
                path="${path/#\~/$HOME}"
                [ -d "$path" ] || continue
                find "$path" -mindepth 1 -name '.*' -prune -o -print 2>/dev/null || true
            done <<<"$ENACT_CACHE_DELTA" | LC_ALL=C sort -u
        }
        set -euo pipefail
        mkdir -p "$delta_dir"
        for id in $(delta_ids); do
            delta_list "$id" > "$delta_dir/$id.restored"
            printf '%s: %s entries after the restore\n' "$id" "$(wc -l < "$delta_dir/$id.restored")"
        done
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
    - name: Require Seeded Cache [frontend tsgo declaration-emit cache]
