          else
            echo "No host-cached $ENACT_RUST_TARGET yet"
          fi
        env:
          ENACT_RUST_HOST_KEY: ${{ runner.os }}-rust-cli_target-${{ hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}
          ENACT_RUST_TARGET: cli/target
      - name: Restore Rust target & cargo cache [rust/target]
        id: rust_l1_cache_rust_target
        if: ${{ (hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',rust/target,') && steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
