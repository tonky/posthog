        path: |-
          /tmp/.cache/uv
          /tmp/.cache/pip
    - name: Prune Rust caches before saving
      if: ${{ (env.ENACT_SAVE_EVENT == 'true' && fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact cache prune-cargo --pipeline .enact
    - parallel:
      - name: Save Node dependency cache
        if: ${{ ((env.ENACT_SAVE_EVENT == 'true' && steps.stage_plan.outputs.stage_needs_node == 'true' && steps.cache_delta.outputs.node_l1_cache == 'true' && steps.runner_caches.outputs.host == '') && steps.node_l1_cache.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.node_l1_cache.outputs.cache-primary-key }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
      - name: Save Rust target & cargo cache [cli/target]
        if: ${{ (((env.ENACT_SAVE_EVENT == 'true' && hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',cli/target,') && steps.runner_caches.outputs.host == '') && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.rust_l1_cache_cli_target.outputs.cache-matched-key, format('{0}-rust-cli_target-{1}-{2}-{3}-', runner.os, hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock'), fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache, hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml'))))) && steps.rust_l1_cache_cli_target.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.rust_l1_cache_cli_target.outputs.cache-primary-key }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
      - name: Save Rust target & cargo cache [cli/target] to the Host Cache
        if: ${{ (env.ENACT_SAVE_EVENT == 'true' && hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',cli/target,') && steps.runner_caches.outputs.host != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        run: |-
          [ -d "$ENACT_RUST_TARGET" ] || exit 0
          dst="$ENACT_HOST_CACHE/repo/cargo-target/$ENACT_RUST_HOST_KEY"
          tmp="$dst.new.$$"
          mkdir -p "$(dirname "$dst")"
          rm -rf "$tmp"
          cp -a --reflink=auto "$ENACT_RUST_TARGET/." "$tmp/"
          if [ -d "$dst" ]; then mv "$dst" "$dst.old.$$"; fi
          mv "$tmp" "$dst"
          rm -rf "$dst.old.$$"
          echo "Saved $ENACT_RUST_TARGET to the host cache ($(du -sh "$dst" | cut -f1))"
        env:
          ENACT_RUST_HOST_KEY: ${{ runner.os }}-rust-cli_target-${{ hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}
          ENACT_RUST_TARGET: cli/target
      - name: Save Rust target & cargo cache [rust/target]
        if: ${{ (((env.ENACT_SAVE_EVENT == 'true' && hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',rust/target,') && steps.runner_caches.outputs.host == '') && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.rust_l1_cache_rust_target.outputs.cache-matched-key, format('{0}-rust-rust_target-{1}-{2}-{3}-', runner.os, hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock'), fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache, hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml'))))) && steps.rust_l1_cache_rust_target.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.rust_l1_cache_rust_target.outputs.cache-primary-key }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
      - name: Save Rust target & cargo cache [rust/target] to the Host Cache
        if: ${{ (env.ENACT_SAVE_EVENT == 'true' && hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',rust/target,') && steps.runner_caches.outputs.host != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        run: |-
          [ -d "$ENACT_RUST_TARGET" ] || exit 0
          dst="$ENACT_HOST_CACHE/repo/cargo-target/$ENACT_RUST_HOST_KEY"
          tmp="$dst.new.$$"
          mkdir -p "$(dirname "$dst")"
          rm -rf "$tmp"
          cp -a --reflink=auto "$ENACT_RUST_TARGET/." "$tmp/"
          if [ -d "$dst" ]; then mv "$dst" "$dst.old.$$"; fi
          mv "$tmp" "$dst"
          rm -rf "$dst.old.$$"
          echo "Saved $ENACT_RUST_TARGET to the host cache ($(du -sh "$dst" | cut -f1))"
        env:
          ENACT_RUST_HOST_KEY: ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}
          ENACT_RUST_TARGET: rust/target
    - name: Upload Telemetry for [preflight]
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-stage-preflight
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
          .enact/state/nodejs/*.services.log
        retention-days: "1"
    - name: Upload Recorded Footprints
      if: ${{ always() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-footprints-stage-preflight
        path: .enact/state/cache/trace-reach.d/
        retention-days: "1"
  reach:
    name: Consolidate Reach Map
    needs:
    - detect
    - preflight
    - test
    - build-outputs
    - build-outputs-2
    - test-built
    if: ${{ !cancelled() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) }}
    runs-on:
    - self-hosted
    - Linux
    - tonky-ci
    - tonky-ci-s
    timeout-minutes: 10
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        git config --global --add safe.directory "*"
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        refs=("+refs/heads/*:refs/heads/*")
        case "$GITHUB_REF" in
            refs/pull/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            ref_current=""
            case "$GITHUB_REF" in
                refs/heads/*|refs/pull/*) ref_current=$(git -C "$mirror" rev-parse --verify -q "$GITHUB_REF^{commit}" 2>/dev/null || true) ;;
                *) ref_current="$GITHUB_SHA" ;;
            esac
            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$GITHUB_SHA" ] || ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags --prune "$url" "${refs[@]}"
                if ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags "$url" "$GITHUB_SHA"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
