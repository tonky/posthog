    - name: Checkout Repository (sparse)
      id: sparse_checkout
      if: ${{ steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure' }}
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        target_sha="$GITHUB_SHA"
        scored_control=0
        if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${ENACT_CONTROL_PIN_REQUIRED:-}" = "true" ]; then
            scored_control=1
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            if [ "$scored_control" -ne 1 ]; then
                echo "::error::control_checkout_sha override is refused outside scored-control workflow_dispatch (control_pin_required=true)" >&2
                exit 1
            fi
            case "$ENACT_CONTROL_CHECKOUT_SHA" in
                *[!0-9a-fA-F]*)
                    echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                    exit 1
                    ;;
            esac
            if [ "${#ENACT_CONTROL_CHECKOUT_SHA}" -ne 40 ]; then
                echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                exit 1
            fi
            target_sha="$ENACT_CONTROL_CHECKOUT_SHA"
        elif [ "$scored_control" -eq 1 ]; then
            echo "::error::scored-control dispatch requires non-empty control_checkout_sha" >&2
            exit 1
        fi
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        cd "$GITHUB_WORKSPACE"
        # shellcheck disable=SC2015
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local protocol.version 2
        git config --local fetch.parallel 0
        git config --local checkout.workers 0
        git config --local index.threads 0
        git config --local advice.detachedHead false
        git config --local gc.auto 0
        cone=()
        while IFS= read -r entry; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [ -n "$entry" ] && cone+=("$entry")
        done <<<"${ENACT_SPARSE_CONE:-}"
        depth="${ENACT_FETCH_DEPTH:-1}"
        fetch_args=(--no-tags --no-recurse-submodules)
        if [ "$depth" != "0" ]; then
            fetch_args+=("--depth=$depth")
        fi
        narrow_cone=0
        if [ "${#cone[@]}" -gt 0 ] && [ "${#cone[@]}" -le 8 ]; then
            narrow_cone=1
            for entry in "${cone[@]}"; do
                case "$entry" in
                    . | ./ | .. | ../*)
                        narrow_cone=0
                        break
                        ;;
                    .* | cue.mod | cue.mod/* | bin | bin/* | */*)
                        ;;
                    *)
                        narrow_cone=0
                        break
                        ;;
                esac
            done
        fi
        if [ "$narrow_cone" = 1 ]; then
            fetch_args+=(--filter=blob:none)
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            git fetch -q "${fetch_args[@]}" origin "$target_sha"
        else
            git fetch -q "${fetch_args[@]}" origin "$target_sha" 2>/dev/null \
                || git fetch -q "${fetch_args[@]}" origin "$GITHUB_REF"
        fi
        if [ "${#cone[@]}" -gt 0 ]; then
            normalized=()
            for entry in "${cone[@]}"; do
                case "$entry" in
                    */.enact-direct-files)
                        normalized+=("$entry")
                        ;;
                    *)
                        kind=$(git cat-file -t "$target_sha:$entry" 2>/dev/null || true)
                        if [ "$kind" = "blob" ]; then
                            case "$entry" in
                                */*) normalized+=("${entry%/*}/.enact-direct-files") ;;
                            esac
                        else
                            normalized+=("$entry")
                        fi
                        ;;
                esac
            done
            if [ "${#normalized[@]}" -gt 0 ]; then
                git sparse-checkout set --cone "${normalized[@]}"
            fi
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            git checkout -q --force --detach "$target_sha"
        else
            case "$GITHUB_REF" in
                refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$target_sha" ;;
                *) git checkout -q --force --detach "$target_sha" ;;
            esac
        fi
        checked_commit=$(git rev-parse HEAD)
        checked_tree=$(git rev-parse "HEAD^{tree}")
        if [ "$checked_commit" != "$target_sha" ]; then
            echo "::error::shallow sparse checkout commit mismatch: expected $target_sha, got $checked_commit" >&2
            exit 1
        fi
        echo "Checked out $checked_commit (tree $checked_tree) (shallow sparse)"
      env:
        ENACT_CONTROL_CHECKOUT_SHA: ${{ inputs.control_checkout_sha }}
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_FETCH_DEPTH: "1"
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
