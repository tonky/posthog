        # without a word: from `/` down, each component owned by root or the user and writable by
        # no one else, a root-owned sticky ancestor excepted.
        trusted_store() {
            local path="" part owner mode uid
            uid=$(id -u)
            IFS=/ read -ra parts <<<"${1#/}"
            for part in "${parts[@]}"; do
                path="$path/$part"
                read -r owner mode < <(stat -c '%u %a' "$path" 2>/dev/null || stat -f '%u %Mp%Lp' "$path")
                mode=$((8#$mode))
                [ "$owner" = 0 ] || [ "$owner" = "$uid" ] || return 1
