        if: ${{ steps.runner_caches.outputs.host == '' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v2-stage-seed-frontend-typecheck-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
          restore-keys: |-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-stage-seed-frontend-typecheck-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-
      - name: Restore Cache [frontend tsgo declaration-emit cache]
        id: cache_frontend_tsgo
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: frontend-tsgo-${{ runner.os }}-${{ github.sha }}
          path: .enact/state/tsgo
          restore-keys: frontend-tsgo-${{ runner.os }}-
      - name: Restore Cache [mypy fine-grained cache]
        id: cache_mypy
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: mypy-${{ runner.os }}-${{ github.sha }}
          path: .mypy_cache
          restore-keys: mypy-${{ runner.os }}-
    - name: Record Restored Package Caches
      if: ${{ steps.runner_caches.outputs.host == '' }}
      continue-on-error: true
      run: |
        # ENACT_CACHE_DELTA: one `<cache id> <path>` line per cached path.
        delta_dir="${RUNNER_TEMP:-/tmp}/enact-cache-delta"
        delta_ids() { awk 'NF { print $1 }' <<<"$ENACT_CACHE_DELTA" | sort -u; }
        # The entries under the cache's paths (dot entries pruned: locks and temporaries), sorted.
        delta_list() {
            local want="$1" id path
            while read -r id path; do
                [ "$id" = "$want" ] || continue
                path="${path/#\~/$HOME}"
                [ -d "$path" ] || continue
                find "$path" -mindepth 1 -name '.*' -prune -o -print 2>/dev/null || true
            done <<<"$ENACT_CACHE_DELTA" | LC_ALL=C sort -u
        }
        set -euo pipefail
        mkdir -p "$delta_dir"
        for id in $(delta_ids); do
            delta_list "$id" > "$delta_dir/$id.restored"
            printf '%s: %s entries after the restore\n' "$id" "$(wc -l < "$delta_dir/$id.restored")"
        done
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
    - name: Download the Reach Map
      continue-on-error: true
