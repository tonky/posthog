        path: |-
          /tmp/.cache/uv
          /tmp/.cache/pip
    - parallel:
      - name: Save Cache [mypy fine-grained cache]
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.cache_mypy.outputs.cache-matched-key, format('mypy-{0}-', runner.os)))) && steps.cache_mypy.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
