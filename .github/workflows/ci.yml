    - name: Fetch the Revisions Selection Ages By
      if: ${{ matrix.selects_in_job }}
      continue-on-error: true
      run: |-
        FETCH="git fetch --no-tags --depth=1 --filter=blob:none origin"
        # shellcheck disable=SC2046,SC2086 # one word per revision
        set -- $(enact trace revisions --missing 2>/dev/null || true) $ENACT_SELECT_BASE
        if [ "$#" -gt 0 ]; then
          $FETCH "$@" 2>/dev/null || for rev in "$@"; do
            $FETCH "$rev" 2>/dev/null || true
          done
        fi
      env:
        ENACT_SELECT_BASE: ${{ matrix.select_base }}
    - name: Pull Dependencies via enve
      run: |-
        store="${ENVE_STORE_DIR:-$HOME/.local/share/enve/store}"
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$store" /nix/store 2>/dev/null || true
        fi
        if [ -f "enve.lock" ]; then
          enve run --locked -- true
        fi
        if [ -n "$ENACT_COMPONENT_DIR" ] && [ "$ENACT_COMPONENT_DIR" != "." ] && [ -f "$ENACT_COMPONENT_DIR/enve.lock" ]; then
          (cd "$ENACT_COMPONENT_DIR" && enve run --locked -- true)
        fi
      env:
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
    - name: Check enve Stores into the Host Cache
      if: ${{ steps.runner_caches.outputs.host != '' }}
      run: |
        #!/usr/bin/env bash
        # enve materializes into `ENVE_STORE_DIR` only while it trusts the directory, and otherwise
        # falls back to its user store or `/tmp/enve-<uid>/store` without failing: on a runner with
        # a host cache that throws the persistent store away on every run. Fails when the job's enve
        # calls wrote into a fallback since the runner cache probe.
        set -euo pipefail
        stamp="${RUNNER_TEMP:-/tmp}/enact-host-cache.stamp"
        for fallback in "${XDG_DATA_HOME:-$HOME/.local/share}/enve/store" "/tmp/enve-$(id -u)/store"; do
            { [ "$fallback" != "$ENVE_STORE_DIR" ] && [ -d "$fallback" ]; } || continue
            if [ -n "$(find "$fallback" -mindepth 1 -maxdepth 1 -newer "$stamp" -print -quit 2>/dev/null)" ]; then
                echo "::error::enve stored into $fallback, not the host cache's $ENVE_STORE_DIR, which it doesn't trust (an owner other than $(id -un) or root, or writable by others)"
                exit 1
            fi
        done
        echo "enve stores into the host cache: $ENVE_STORE_DIR"
    - name: Install Project Dependencies
      if: hashFiles('package.json') != '' && (contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node'))
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        set -f
        for arg in ${ENACT_MATRIX_FILTER_ARGS:-}; do set -- "$@" "$arg"; done
        set +f
        echo "📦 Installing project dependencies..."
        ENACT_INSTALL_INPUTS=$(mktemp "$RUNNER_TEMP/enact-install-inputs.XXXXXX")
        sha256sum pnpm-lock.yaml > "$ENACT_INSTALL_INPUTS"
        for input in package.json pnpm-workspace.yaml enve.lock; do
          if [ -f "$input" ]; then sha256sum "$input" >> "$ENACT_INSTALL_INPUTS"; fi
        done
        $RUN_PREFIX pnpm install "$@" --frozen-lockfile --store-dir "${ENACT_PNPM_STORE:-$PWD/.enact/state/pnpm-store}" --offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink --config.fetch-retries=2 --config.fetch-retry-maxtimeout=10000 --network-concurrency=16 ||
          $RUN_PREFIX pnpm install "$@" --frozen-lockfile --store-dir "${ENACT_PNPM_STORE:-$PWD/.enact/state/pnpm-store}" --prefer-offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink --config.fetch-retries=2 --config.fetch-retry-maxtimeout=10000 --network-concurrency=16 || exit $?
        sha256sum --check "$ENACT_INSTALL_INPUTS"
        rm "$ENACT_INSTALL_INPUTS"
        echo "ENACT_PREPARED=${ENACT_PREPARED:+$ENACT_PREPARED,}node" >> "$GITHUB_ENV"
      env:
        ENACT_MATRIX_FILTER_ARGS: ${{ matrix.filter_args }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Install Python Dependencies
      id: python_install
      if: hashFiles('pyproject.toml', 'requirements.txt') != '' && contains(matrix.technology, 'python')
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        echo "🐍 Ensuring Python environment and dependencies..."
        $RUN_PREFIX sh -c "$ENACT_PYTHON_INSTALL"
        echo "ENACT_PREPARED=${ENACT_PREPARED:+$ENACT_PREPARED,}python" >> "$GITHUB_ENV"
      env:
        ENACT_PYTHON_INSTALL: bash showcase/scripts/setup.sh backend
    - name: Execute Component Task
      run: eval "$ENACT_MATRIX_COMMAND"
      env:
