    - name: Restore Reach Store
      id: reach-store
      if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.control_pin_required == 'true') }}
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-reach-${{ github.head_ref || github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .git/enact/reach
        restore-keys: |-
          enact-reach-${{ github.head_ref || github.ref_name }}-${{ github.sha }}-
          enact-reach-${{ github.head_ref || github.ref_name }}-
          enact-reach-${{ github.base_ref || github.event.repository.default_branch }}-
    - name: Install committed enact & enve builds
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Ensure enve & enact CLI on PATH
      id: setup-runner
      run: enact ci setup-runner
    - name: Restore Pinned Control Inputs
      id: control_restore
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.control_pin_required == 'true' }}
      run: |
        set -euo pipefail
        require_numeric_id() {
          local label="$1" val="$2"
          case "$val" in
            ""|*[!0-9]*)
              echo "::error::control restore requires numeric $label, got '$val'" >&2
              exit 1
              ;;
          esac
        }
        normalize_sha256() {
          local label="$1" raw="${2#sha256:}"
          raw=$(printf '%s' "$raw" | tr 'A-F' 'a-f')
          case "$raw" in
            *[!0-9a-f]*)
              echo "::error::control restore $label must be 64-char hex SHA-256, got '$2'" >&2
              exit 1
              ;;
          esac
          if [ "${#raw}" -ne 64 ]; then
            echo "::error::control restore $label must be 64-char hex SHA-256, got '$2'" >&2
            exit 1
          fi
          printf '%s' "$raw"
        }
        sha256_of_file() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }
        download_verified_artifact_zip() {
          local label="$1" artifact_id="$2" expected_raw="$3" dest_zip="$4"
          require_numeric_id "$label artifact ID" "$artifact_id"
          local expected_sha
          expected_sha=$(normalize_sha256 "$label ZIP SHA-256" "$expected_raw")
          local meta expired run_id
          meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq '[(.expired|tostring), ((.workflow_run.id // 0)|tostring)] | @tsv')
          expired=$(printf '%s' "$meta" | awk -F'\t' '{print $1}')
          run_id=$(printf '%s' "$meta" | awk -F'\t' '{print $2}')
          if [ "$expired" != "false" ]; then
            echo "::error::control restore $label artifact $artifact_id is expired" >&2
            exit 1
          fi
          if [ "$run_id" != "$ENACT_CONTROL_SOURCE_RUN_ID" ]; then
            echo "::error::control restore $label artifact $artifact_id belongs to run $run_id, expected $ENACT_CONTROL_SOURCE_RUN_ID" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$dest_zip"
          local actual_sha
          actual_sha=$(sha256_of_file "$dest_zip")
          if [ "$actual_sha" != "$expected_sha" ]; then
            rm -f "$dest_zip"
            echo "::error::control restore $label ZIP SHA-256 mismatch before extraction: expected $expected_sha, got $actual_sha" >&2
            exit 1
          fi
        }
        require_numeric_id "control_source_run_id" "${ENACT_CONTROL_SOURCE_RUN_ID:-}"
        require_numeric_id "control_source_run_attempt" "${ENACT_CONTROL_SOURCE_RUN_ATTEMPT:-}"
        if [ "$ENACT_CONTROL_SOURCE_RUN_ATTEMPT" -lt 1 ]; then
          echo "::error::control_source_run_attempt must be >= 1, got '$ENACT_CONTROL_SOURCE_RUN_ATTEMPT'" >&2
          exit 1
        fi
        require_hex40() {
          local label="$1" val="$2"
          case "$val" in
            ""|*[!0-9a-fA-F]*)
              echo "::error::scored-control mode requires 40-char hex $label, got '$val'" >&2
              exit 1
              ;;
          esac
          if [ "${#val}" -ne 40 ]; then
            echo "::error::scored-control mode requires 40-char hex $label, got '$val'" >&2
            exit 1
          fi
        }
        require_hex40 "control_checkout_sha" "${ENACT_CONTROL_CHECKOUT_SHA:-}"
        require_hex40 "base_ref" "${ENACT_BASE_REF:-}"
        run_meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ENACT_CONTROL_SOURCE_RUN_ID}/attempts/${ENACT_CONTROL_SOURCE_RUN_ATTEMPT}" --jq '[(.status // ""), (.conclusion // ""), ((.run_attempt // 0)|tostring), (.path // ""), (.head_sha // "")] | @tsv')
        run_status=$(printf '%s' "$run_meta" | awk -F'\t' '{print $1}')
        run_conclusion=$(printf '%s' "$run_meta" | awk -F'\t' '{print $2}')
        run_attempt=$(printf '%s' "$run_meta" | awk -F'\t' '{print $3}')
        run_workflow=$(printf '%s' "$run_meta" | awk -F'\t' '{print $4}')
        run_head_sha=$(printf '%s' "$run_meta" | awk -F'\t' '{print $5}')
        if [ "$run_status" != "completed" ] || [ "$run_conclusion" != "success" ] || [ "$run_attempt" != "$ENACT_CONTROL_SOURCE_RUN_ATTEMPT" ] || [ "$run_workflow" != "$ENACT_CONTROL_WORKFLOW_PATH" ]; then
          echo "::error::control source run $ENACT_CONTROL_SOURCE_RUN_ID attempt $ENACT_CONTROL_SOURCE_RUN_ATTEMPT rejected (status=$run_status conclusion=$run_conclusion attempt=$run_attempt workflow=$run_workflow expected_workflow=$ENACT_CONTROL_WORKFLOW_PATH)" >&2
          exit 1
        fi
        require_hex40 "source run head_sha" "$run_head_sha"
        CONTROL_SEL_DIR="$RUNNER_TEMP/enact-control-selection"
        rm -rf "$CONTROL_SEL_DIR"
        mkdir -p "$CONTROL_SEL_DIR"
        download_verified_artifact_zip "selection" "${ENACT_CONTROL_SELECTION_ARTIFACT_ID:-}" "${ENACT_CONTROL_SELECTION_ZIP_SHA256:-}" "$CONTROL_SEL_DIR/selection.zip"
        unzip -oq "$CONTROL_SEL_DIR/selection.zip" -d "$CONTROL_SEL_DIR"
        rm -f "$CONTROL_SEL_DIR/selection.zip"
        if [ ! -f "$CONTROL_SEL_DIR/selection.json" ]; then
          echo "::error::control restore selection archive must contain selection.json" >&2
          exit 1
        fi
        sel_rev=$(sed -n 's/.*"revision"[[:space:]]*:[[:space:]]*"\([0-9a-fA-F]\{40\}\)".*/\1/p' "$CONTROL_SEL_DIR/selection.json" | head -n 1)
        sel_base=$(sed -n 's/.*"base"[[:space:]]*:[[:space:]]*"\([0-9a-fA-F]\{40\}\)".*/\1/p' "$CONTROL_SEL_DIR/selection.json" | head -n 1)
        if [ -z "$sel_rev" ] || [ "$sel_rev" != "$ENACT_CONTROL_CHECKOUT_SHA" ]; then
          echo "::error::control checkout SHA '$ENACT_CONTROL_CHECKOUT_SHA' does not match source selection receipt revision '$sel_rev'" >&2
          exit 1
        fi
        if [ -z "$sel_base" ] || [ "$sel_base" != "$ENACT_BASE_REF" ]; then
          echo "::error::control base_ref '$ENACT_BASE_REF' does not match source selection receipt base '$sel_base'" >&2
          exit 1
        fi
        actual_head=$(git rev-parse HEAD)
        actual_tree=$(git rev-parse "HEAD^{tree}")
        if [ "$actual_head" != "$ENACT_CONTROL_CHECKOUT_SHA" ]; then
          echo "::error::control checkout mismatch: expected $ENACT_CONTROL_CHECKOUT_SHA, got $actual_head" >&2
          exit 1
        fi
        if ! git cat-file -e "${ENACT_BASE_REF}^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$ENACT_BASE_REF"
        fi
        actual_base=$(git rev-parse --verify "${ENACT_BASE_REF}^{commit}")
        if [ "$actual_base" != "$ENACT_BASE_REF" ]; then
          echo "::error::control base commit mismatch: expected $ENACT_BASE_REF, got $actual_base" >&2
          exit 1
        fi
        head_parent2=$(git cat-file -p HEAD | awk '$1=="parent"{n++; if(n==2) print $2}')
        if [ -n "$head_parent2" ] && [ "$head_parent2" != "$run_head_sha" ]; then
          echo "::error::tested merge 2nd parent '$head_parent2' does not match source run PR head_sha '$run_head_sha'" >&2
          exit 1
        fi
        if ! git cat-file -e "${run_head_sha}^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$run_head_sha"
        fi
        if ! git cat-file -e "${run_head_sha}^{commit}" 2>/dev/null; then
          echo "::error::source run PR head commit '$run_head_sha' is not present locally after fetch" >&2
          exit 1
        fi
        printf 'ENACT_PR_HEAD_SHA=%s\n' "$run_head_sha" >> "$GITHUB_ENV"
        printf 'GITHUB_HEAD_SHA=%s\n' "$run_head_sha" >> "$GITHUB_ENV"
        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          printf 'head_sha=%s\n' "$run_head_sha" >> "$GITHUB_OUTPUT"
        fi
        echo "Control source verified: run=$ENACT_CONTROL_SOURCE_RUN_ID attempt=$run_attempt workflow=$run_workflow transport_sha=${GITHUB_SHA:-<unset>} commit=$actual_head tree=$actual_tree base=$actual_base pr_head=$run_head_sha"
        CONTROL_REACH_DIR="$RUNNER_TEMP/enact-control-reach"
        rm -rf "$CONTROL_REACH_DIR" "$RUNNER_TEMP/enact-reach"
        mkdir -p "$CONTROL_REACH_DIR/archive" "$CONTROL_REACH_DIR/input"
        download_verified_artifact_zip "reach-map" "${ENACT_CONTROL_MAP_ARTIFACT_ID:-}" "${ENACT_CONTROL_MAP_ZIP_SHA256:-}" "$CONTROL_REACH_DIR/reach.zip"
        unzip -oq "$CONTROL_REACH_DIR/reach.zip" -d "$CONTROL_REACH_DIR/archive"
        rm -f "$CONTROL_REACH_DIR/reach.zip"
        if [ ! -f "$CONTROL_REACH_DIR/archive/map.bin" ] || [ ! -f "$CONTROL_REACH_DIR/archive/map.age.json" ]; then
          echo "::error::control restore reach-map archive must contain map.bin and map.age.json" >&2
          exit 1
        fi
        cp "$CONTROL_REACH_DIR/archive/map.bin" "$CONTROL_REACH_DIR/input/map.bin"
        printf 'ENACT_REACH_FILE=%s\n' "$CONTROL_REACH_DIR/input/map.bin" >> "$GITHUB_ENV"
        echo "Control reach map restored: map.bin=$(sha256_of_file "$CONTROL_REACH_DIR/input/map.bin") archived_age=$(sha256_of_file "$CONTROL_REACH_DIR/archive/map.age.json")"
        CONTROL_HIST_DIR="$RUNNER_TEMP/enact-history-input"
        rm -rf "$CONTROL_HIST_DIR"
        mkdir -p "$CONTROL_HIST_DIR"
        download_verified_artifact_zip "history" "${ENACT_CONTROL_HISTORY_ARTIFACT_ID:-}" "${ENACT_CONTROL_HISTORY_ZIP_SHA256:-}" "$CONTROL_HIST_DIR/history.zip"
        unzip -oq "$CONTROL_HIST_DIR/history.zip" -d "$CONTROL_HIST_DIR"
        rm -f "$CONTROL_HIST_DIR/history.zip"
        if [ ! -f "$CONTROL_HIST_DIR/snapshot.json" ] || [ ! -f "$CONTROL_HIST_DIR/snapshot.manifest.json" ]; then
          echo "::error::control restore history archive must contain snapshot.json and snapshot.manifest.json" >&2
          exit 1
        fi
        echo "Control history restored: snapshot.json=$(sha256_of_file "$CONTROL_HIST_DIR/snapshot.json")"
      env:
        ENACT_BASE_REF: ${{ inputs.base_ref }}
        ENACT_CONTROL_CHECKOUT_SHA: ${{ inputs.control_checkout_sha }}
        ENACT_CONTROL_HISTORY_ARTIFACT_ID: ${{ inputs.control_history_artifact_id }}
        ENACT_CONTROL_HISTORY_ZIP_SHA256: ${{ inputs.control_history_zip_sha256 }}
        ENACT_CONTROL_MAP_ARTIFACT_ID: ${{ inputs.control_map_artifact_id }}
        ENACT_CONTROL_MAP_ZIP_SHA256: ${{ inputs.control_map_zip_sha256 }}
        ENACT_CONTROL_SELECTION_ARTIFACT_ID: ${{ inputs.control_selection_artifact_id }}
        ENACT_CONTROL_SELECTION_ZIP_SHA256: ${{ inputs.control_selection_zip_sha256 }}
        ENACT_CONTROL_SOURCE_RUN_ATTEMPT: ${{ inputs.control_source_run_attempt }}
        ENACT_CONTROL_SOURCE_RUN_ID: ${{ inputs.control_source_run_id }}
        ENACT_CONTROL_WORKFLOW_PATH: .github/workflows/ci.yml
        GH_TOKEN: ${{ github.token }}
    - name: Select Immutable CI History
      id: history_restore
      run: |-
        if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${ENACT_CONTROL_PIN_REQUIRED:-}" = "true" ]; then
          if [ ! -f "$RUNNER_TEMP/enact-history-input/snapshot.json" ] || [ ! -f "$RUNNER_TEMP/enact-history-input/snapshot.manifest.json" ]; then
            echo "::error::control restore history snapshot missing before import" >&2
            exit 1
          fi
        else
          enact ci history restore --pipeline "$ENACT_HISTORY_PIPELINE" --repo "$GITHUB_REPOSITORY" --workflow "$ENACT_HISTORY_WORKFLOW" --head "$ENACT_HISTORY_HEAD" --output "$RUNNER_TEMP/enact-history-input/snapshot.json" --max-runs 8 --max-age-days 14 --max-bytes 4194304
        fi
        export ENACT_HISTORY_DIR="$RUNNER_TEMP/enact-history"
        printf 'ENACT_HISTORY_DIR=%s\n' "$ENACT_HISTORY_DIR" >> "$GITHUB_ENV"
        enact ci history import --input "$RUNNER_TEMP/enact-history-input/snapshot.json" --manifest "$RUNNER_TEMP/enact-history-input/snapshot.manifest.json" --output "$ENACT_HISTORY_DIR"
        printf 'artifact=enact-history-input-v1-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      env:
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_HISTORY_HEAD: ${{ inputs.control_checkout_sha || github.event.pull_request.head.sha || github.sha }}
        ENACT_HISTORY_PIPELINE: .enact
        ENACT_HISTORY_WORKFLOW: .github/workflows/ci.yml
        GH_TOKEN: ${{ github.token }}
    - name: Cache history Handoff on the Receiving Host
      if: env.ENACT_HOST_CACHE != ''
      continue-on-error: true
      run: enact ci handoff history --publish --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-history-input"
      env:
        ENACT_HANDOFF_ARTIFACT: enact-history-input-v1-${{ github.run_attempt }}
    - name: Hand CI History to the Jobs
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: enact-history-input-v1-${{ github.run_attempt }}
        path: |-
          ${{ runner.temp }}/enact-history-input/snapshot.json
          ${{ runner.temp }}/enact-history-input/snapshot.manifest.json
        retention-days: "14"
    - name: Compute Affected Component Matrix
      id: diff
      run: |-
        if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
          cd "${GITHUB_WORKSPACE}"
        fi
        RESOLVED=$(enact ci resolve-base) || exit
        eval "$RESOLVED"
        ADMISSION_REPORT="$RUNNER_TEMP/enact-admission.json"
        MATRIX=$(enact ci matrix --pipeline .enact --workflow ci --github-output "$GITHUB_OUTPUT" --reach-hand-off "$RUNNER_TEMP/enact-reach" --selection-record .enact/state/selection.json --shard-manifest "$RUNNER_TEMP/enact-shard-manifest" --budget --budget-report "$ADMISSION_REPORT" "$@" --format json) || {
          status=$?
          if [ "$status" -ge 128 ]; then
            echo "::error::enact ci matrix terminated by signal/OOM (exit $status)" >&2
          else
            echo "::error::CI budget admission failed; report: $ADMISSION_REPORT" >&2
          fi
          exit "$status"
        }
        echo "$MATRIX"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID || env.R2_READ_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY || env.R2_READ_SECRET_ACCESS_KEY }}
        ENACT_BASE_REF: ${{ inputs.base_ref || github.base_ref || github.event.pull_request.base.ref }}
        ENACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        ENACT_DETECT_OTHER_OUTPUTS: ${{ format('{{"history_input_artifact":{0}}}', toJSON(steps.history_restore.outputs.artifact)) }}
        ENACT_EVENT_BEFORE: ${{ github.event.before }}
        ENACT_FORCE_NO_CACHE: ${{ inputs.no_cache == 'true' || vars.ENACT_NO_CACHE == 'true' || contains(github.event.pull_request.title, '[no-cache]') || contains(github.event.pull_request.body, '[no-cache]') || contains(github.event.pull_request.labels.*.name, 'no-cache') }}
        ENACT_FORCE_RERUN: ${{ contains(github.event.pull_request.title, '[rerun]') || contains(github.event.pull_request.body, '[rerun]') || contains(github.event.pull_request.labels.*.name, 'rerun') || contains(github.event.pull_request.labels.*.name, 'showcase') || startsWith(github.head_ref, 'showcase/') || startsWith(github.ref_name, 'showcase/') }}
        ENACT_INPUT_ALL: ${{ inputs.all }}
        ENACT_INPUT_FILES: ${{ inputs.files }}
        ENACT_INPUT_FORCE_WARM_SUITES: ${{ inputs.force_warm_suites }}
        ENACT_INPUT_SEED_CACHES: ${{ inputs.seed_caches }}
        ENACT_INPUT_UPDATED: ${{ inputs.updated }}
        ENACT_INPUT_WARM_REACH: ${{ inputs.warm_reach }}
        ENACT_INTEGRATION_BRANCH: ${{ vars.ENACT_INTEGRATION_BRANCH }}
        ENACT_PIN_DIFF_SHA256: ${{ inputs.pin_diff_sha256 }}
        ENACT_PIN_HISTORY_SHA256: ${{ inputs.pin_history_sha256 }}
        ENACT_PIN_REACH_AGE_SHA256: ${{ inputs.pin_reach_age_sha256 }}
        ENACT_PIN_REACH_MAP_SHA256: ${{ inputs.pin_reach_map_sha256 }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_RECORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && inputs.control_pin_required != 'true' && github.ref_name == github.event.repository.default_branch) && 'every' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch) && 'auto' || 'off' }}
        ENACT_SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.control_restore.outputs.head_sha }}
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    - name: Upload the Selection Record
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-selection
        path: .enact/state/selection.json
        retention-days: "30"
    - name: Cache Shard Manifest Handoff on the Receiving Host
      if: env.ENACT_HOST_CACHE != ''
      continue-on-error: true
      run: |-
        if [ -f "$RUNNER_TEMP/enact-shard-manifest/manifest.json" ]; then
          enact ci handoff shard-manifest --publish --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-shard-manifest"
        fi
      env:
        ENACT_HANDOFF_ARTIFACT: enact-shard-manifest
    - name: Hand the Frozen Shard Manifest to the Jobs
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-shard-manifest
        path: ${{ runner.temp }}/enact-shard-manifest
        retention-days: "30"
    - name: Cache reach Handoff on the Receiving Host
      if: env.ENACT_HOST_CACHE != ''
      continue-on-error: true
      run: enact ci handoff reach --publish --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-reach"
      env:
        ENACT_HANDOFF_ARTIFACT: enact-reach-map
    - name: Hand the Reach Map to the Jobs
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        compression-level: "0"
        if-no-files-found: ignore
        name: enact-reach-map
        path: ${{ runner.temp }}/enact-reach
        retention-days: "1"
  lookup-outputs-e2e--build:
    name: Look Up Outputs (e2e--build)
    permissions:
      contents: read
    needs:
    - detect
    if: ${{ needs.detect.outputs.builds_e2e__build != '{"include":[]}' && needs.detect.outputs.builds_e2e__build != '[]' && needs.detect.outputs.builds_e2e__build != '' }}
    runs-on:
    - self-hosted
    - Linux
    - tonky-ci
    - tonky-ci-c2m6g
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      hit: ${{ steps.confirm.outputs.hit }}
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      continue-on-error: true
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        target_sha="$GITHUB_SHA"
        scored_control=0
        if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${ENACT_CONTROL_PIN_REQUIRED:-}" = "true" ]; then
            scored_control=1
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            if [ "$scored_control" -ne 1 ]; then
                echo "::error::control_checkout_sha override is refused outside scored-control workflow_dispatch (control_pin_required=true)" >&2
                exit 1
            fi
            case "$ENACT_CONTROL_CHECKOUT_SHA" in
                *[!0-9a-fA-F]*)
                    echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                    exit 1
                    ;;
            esac
            if [ "${#ENACT_CONTROL_CHECKOUT_SHA}" -ne 40 ]; then
                echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                exit 1
            fi
            target_sha="$ENACT_CONTROL_CHECKOUT_SHA"
        elif [ "$scored_control" -eq 1 ]; then
            echo "::error::scored-control dispatch requires non-empty control_checkout_sha" >&2
            exit 1
        fi
        export GIT_CONFIG_COUNT=2
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        export GIT_CONFIG_KEY_1=safe.directory
        export GIT_CONFIG_VALUE_1="$mirror"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        base_ref="${GITHUB_BASE_REF:-${ENACT_BASE_REF:-}}"
        depth="${ENACT_HOST_FETCH_DEPTH:-50}"
        fetch_args=(--no-tags)
        if [ "$depth" != "0" ]; then
            fetch_args+=("--depth=$depth")
        fi
        refs=()
        case "${GITHUB_REF:-}" in
            refs/heads/*|refs/pull/*|refs/tags/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        if [ -n "$base_ref" ] && [ "refs/heads/$base_ref" != "${GITHUB_REF:-}" ]; then
            refs+=("+refs/heads/$base_ref:refs/heads/$base_ref")
        fi
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            ref_current=""
            case "${GITHUB_REF:-}" in
                refs/heads/*|refs/pull/*|refs/tags/*) ref_current=$(git -C "$mirror" rev-parse --verify -q "$GITHUB_REF^{commit}" 2>/dev/null || true) ;;
                *) ref_current="$target_sha" ;;
            esac
            base_missing=0
            if [ -n "$base_ref" ] && ! git -C "$mirror" rev-parse --verify -q "refs/heads/$base_ref^{commit}" >/dev/null 2>&1; then
                base_missing=1
            fi
            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$target_sha" ] || [ "$base_missing" = 1 ] || ! git -C "$mirror" cat-file -e "$target_sha^{commit}" 2>/dev/null; then
                if [ "${#refs[@]}" -gt 0 ]; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "${refs[@]}" \
                        || git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "$target_sha"
                else
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "$target_sha"
                fi
                if ! git -C "$mirror" cat-file -e "$target_sha^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q "${fetch_args[@]}" "$url" "$target_sha"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        mirror_branches=()
        case "${GITHUB_REF:-}" in
            refs/heads/*) mirror_branches+=("${GITHUB_REF#refs/heads/}") ;;
        esac
        if [ -n "$base_ref" ] && [ "refs/heads/$base_ref" != "${GITHUB_REF:-}" ]; then
            mirror_branches+=("$base_ref")
        fi
        if [ "${#mirror_branches[@]}" -gt 0 ]; then
            for ref_branch in "${mirror_branches[@]}"; do
                ref_sha=$(git -C "$mirror" rev-parse --verify -q "refs/heads/$ref_branch^{commit}" 2>/dev/null || true)
                if [ -n "$ref_sha" ]; then
                    git update-ref "refs/remotes/origin/$ref_branch" "$ref_sha"
                fi
            done
        fi
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            raw_cone=()
            while IFS= read -r entry; do
                entry="${entry#"${entry%%[![:space:]]*}"}"
                entry="${entry%"${entry##*[![:space:]]}"}"
                [ -n "$entry" ] && raw_cone+=("$entry")
            done <<<"$ENACT_SPARSE_CONE"
            cone=()
            to_check=()
            if [ "${#raw_cone[@]}" -gt 0 ]; then
                for entry in "${raw_cone[@]}"; do
                    case "$entry" in
                        */.enact-direct-files)
                            cone+=("$entry")
                            ;;
                        *)
                            to_check+=("$entry")
                            ;;
                    esac
                done
            fi
            if [ "${#to_check[@]}" -gt 0 ]; then
                idx=0
                while IFS= read -r kind; do
                    entry="${to_check[$idx]}"
                    idx=$((idx + 1))
                    if [ "$kind" = "blob" ]; then
                        case "$entry" in
                            */*) cone+=("${entry%/*}/.enact-direct-files") ;;
                        esac
                    else
                        cone+=("$entry")
                    fi
                done < <(
                    for entry in "${to_check[@]}"; do
                        printf '%s:%s\n' "${target_sha:-$GITHUB_SHA}" "$entry"
                    done | git cat-file --batch-check='%(objecttype)'
                )
            fi
            if [ "${#cone[@]}" -gt 0 ]; then
                git sparse-checkout set --cone "${cone[@]}"
            fi
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            git checkout -q --force --detach "$target_sha"
        else
            case "${GITHUB_REF:-}" in
                refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$target_sha" ;;
                *) git checkout -q --force --detach "$target_sha" ;;
            esac
        fi
        checked_commit=$(git rev-parse HEAD)
        checked_tree=$(git rev-parse "HEAD^{tree}")
        if [ "$checked_commit" != "$target_sha" ]; then
            echo "::error::host checkout commit mismatch: expected $target_sha, got $checked_commit" >&2
            exit 1
        fi
        echo "Checked out $checked_commit (tree $checked_tree) through the host mirror"
      env:
        ENACT_CONTROL_CHECKOUT_SHA: ${{ inputs.control_checkout_sha }}
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
    - name: Checkout Repository (sparse)
      id: sparse_checkout
      if: ${{ steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        target_sha="$GITHUB_SHA"
        scored_control=0
        if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${ENACT_CONTROL_PIN_REQUIRED:-}" = "true" ]; then
            scored_control=1
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            if [ "$scored_control" -ne 1 ]; then
                echo "::error::control_checkout_sha override is refused outside scored-control workflow_dispatch (control_pin_required=true)" >&2
                exit 1
            fi
            case "$ENACT_CONTROL_CHECKOUT_SHA" in
                *[!0-9a-fA-F]*)
                    echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                    exit 1
                    ;;
            esac
            if [ "${#ENACT_CONTROL_CHECKOUT_SHA}" -ne 40 ]; then
                echo "::error::ENACT_CONTROL_CHECKOUT_SHA must be 40-char hex, got '$ENACT_CONTROL_CHECKOUT_SHA'" >&2
                exit 1
            fi
            target_sha="$ENACT_CONTROL_CHECKOUT_SHA"
        elif [ "$scored_control" -eq 1 ]; then
            echo "::error::scored-control dispatch requires non-empty control_checkout_sha" >&2
            exit 1
        fi
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        cd "$GITHUB_WORKSPACE"
        # shellcheck disable=SC2015
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local protocol.version 2
        git config --local fetch.parallel 0
        git config --local checkout.workers 0
        git config --local index.threads 0
        git config --local advice.detachedHead false
        git config --local gc.auto 0
        cone=()
        while IFS= read -r entry; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [ -n "$entry" ] && cone+=("$entry")
        done <<<"${ENACT_SPARSE_CONE:-}"
        depth="${ENACT_FETCH_DEPTH:-1}"
        fetch_args=(--no-tags --no-recurse-submodules)
        if [ "$depth" != "0" ]; then
            fetch_args+=("--depth=$depth")
        fi
        narrow_cone=0
        if [ "${#cone[@]}" -gt 0 ] && [ "${#cone[@]}" -le 8 ]; then
            narrow_cone=1
            for entry in "${cone[@]}"; do
                case "$entry" in
                    . | ./ | .. | ../*)
                        narrow_cone=0
                        break
                        ;;
                    .* | cue.mod | cue.mod/* | bin | bin/* | */*)
                        ;;
                    *)
                        narrow_cone=0
                        break
                        ;;
                esac
            done
        fi
        if [ "$narrow_cone" = 1 ]; then
            fetch_args+=(--filter=blob:none)
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            git fetch -q "${fetch_args[@]}" origin "$target_sha"
        else
            git fetch -q "${fetch_args[@]}" origin "$target_sha" 2>/dev/null \
                || git fetch -q "${fetch_args[@]}" origin "$GITHUB_REF"
        fi
        if [ "${#cone[@]}" -gt 0 ]; then
            normalized=()
            for entry in "${cone[@]}"; do
                case "$entry" in
                    */.enact-direct-files)
                        normalized+=("$entry")
                        ;;
                    *)
                        kind=$(git cat-file -t "$target_sha:$entry" 2>/dev/null || true)
                        if [ "$kind" = "blob" ]; then
                            case "$entry" in
                                */*) normalized+=("${entry%/*}/.enact-direct-files") ;;
                            esac
                        else
                            normalized+=("$entry")
                        fi
                        ;;
                esac
            done
            if [ "${#normalized[@]}" -gt 0 ]; then
                git sparse-checkout set --cone "${normalized[@]}"
            fi
        fi
        if [ -n "${ENACT_CONTROL_CHECKOUT_SHA:-}" ]; then
            git checkout -q --force --detach "$target_sha"
        else
            case "$GITHUB_REF" in
                refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$target_sha" ;;
                *) git checkout -q --force --detach "$target_sha" ;;
            esac
        fi
        checked_commit=$(git rev-parse HEAD)
        checked_tree=$(git rev-parse "HEAD^{tree}")
        if [ "$checked_commit" != "$target_sha" ]; then
            echo "::error::shallow sparse checkout commit mismatch: expected $target_sha, got $checked_commit" >&2
            exit 1
        fi
        echo "Checked out $checked_commit (tree $checked_tree) (shallow sparse)"
      env:
        ENACT_CONTROL_CHECKOUT_SHA: ${{ inputs.control_checkout_sha }}
        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_FETCH_DEPTH: "1"
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
    - name: Install committed enact & enve builds
      continue-on-error: true
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Probe & Verify Built Outputs
      id: probe
      continue-on-error: true
      run: enact ci host-outputs probe-builds
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID || env.R2_READ_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY || env.R2_READ_SECRET_ACCESS_KEY }}
        ENACT_CACHE_WRITE: read_only
        ENACT_OUTPUTS_MATRIX: ${{ needs.detect.outputs.builds_e2e__build }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
    - name: Upload Verified Outputs Artifact
      id: publish-artifact
