    - name: Install committed enact & enve builds
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Ensure enve & enact CLI on PATH
      id: setup-runner
      run: enact ci setup-runner
    - parallel:
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: ${{ steps.runner_caches.outputs.host == '' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v4-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            .enact/state/pnpm-cache
            node_modules/.cache
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-v4-
      - name: Restore Python build & venv cache
        id: python_l1_cache
        if: hashFiles('pyproject.toml', 'requirements.txt') != '' && steps.runner_caches.outputs.host == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-python-v2-${{ hashFiles('uv.lock', 'pyproject.toml', 'requirements.txt', 'poetry.lock', 'enve.lock') }}
          path: |-
            /tmp/.cache/uv
            /tmp/.cache/pip
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-python-v2-
      - name: Restore Go build & module seed cache
        id: go_l1_cache
        if: hashFiles('go.mod', 'go.sum', 'go.work', 'go.work.sum', 'enve.lock') != '' && steps.runner_caches.outputs.host == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-go-seed-${{ hashFiles('go.mod', 'go.sum', 'go.work', 'go.work.sum', 'enve.lock') }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-seed-
    - name: Record Restored Package Caches
      if: (steps.runner_caches.outputs.host == '' && steps.node_l1_cache.outputs.cache-hit != 'true' || steps.runner_caches.outputs.host == '' && steps.python_l1_cache.outputs.cache-hit != 'true') && github.event_name != 'pull_request'
      continue-on-error: true
      run: enact ci cache-delta record
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache .enact/state/pnpm-cache
          node_l1_cache node_modules/.cache
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
        ENACT_CACHE_HITS: |-
          node_l1_cache=${{ steps.node_l1_cache.outputs.cache-hit }}
          python_l1_cache=${{ steps.python_l1_cache.outputs.cache-hit }}
    - name: Pull Dependencies via enve
      if: ${{ steps.node_l1_cache.outputs.cache-hit != 'true' || steps.python_l1_cache.outputs.cache-hit != 'true' && hashFiles('pyproject.toml', 'requirements.txt') != '' || steps.go_l1_cache.outputs.cache-hit != 'true' && hashFiles('**/go.mod', '**/go.sum') != '' }}
      run: enact ci deps pull --remote signed
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID || env.R2_READ_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY || env.R2_READ_SECRET_ACCESS_KEY }}
        ENACT_ENVIRONMENT_DIRS: "[\".\",\"bin/hobby-installer\",\"cli\",\"clickhouse-udfs\",\"common/hogvm\",\"funnel-udf\",\"livestream\",\"nodejs\",\"packages/agent\",\"packages/quill\",\"posthog/api/test/rust_integration\",\"products/desktop\",\"proto\",\"rust\",\"rust/deltalite/python\",\"rust/personhog-test-harness\",\"services/agent-proxy\",\"services/llm-gateway\",\"services/mcp\",\"services/mcp/tests\",\"services/oauth-proxy\",\"tools/openapi-codegen\",\"tools/phrocs\"]"
        ENACT_ENVIRONMENT_FILES: "[]"
        ENACT_JOB_SERVICES: azurite,clickhouse,etcd,kafka,postgres,redis,seaweedfs,seaweedfs-open,temporal,valkey-cluster
        ENACT_PREPARE_ENVIRONMENT_FILES: "[\"enve.cue\"]"
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Check enve Stores into the Host Cache
      if: ${{ steps.runner_caches.outputs.host != '' && (steps.node_l1_cache.outputs.cache-hit != 'true' || steps.python_l1_cache.outputs.cache-hit != 'true' && hashFiles('pyproject.toml', 'requirements.txt') != '' || steps.go_l1_cache.outputs.cache-hit != 'true' && hashFiles('**/go.mod', '**/go.sum') != '') }}
      run: enact ci check-store
    - name: Install Project Dependencies
      if: ${{ steps.node_l1_cache.outputs.cache-hit != 'true' }}
      run: enact ci deps install node --manager pnpm
      env:
        ENACT_ENVIRONMENT_FILE: enve.cue
    - name: Install Python Dependencies
      id: python_install
      if: ${{ steps.python_l1_cache.outputs.cache-hit != 'true' && hashFiles('pyproject.toml', 'requirements.txt') != '' }}
      run: enact ci deps install python --manager uv
      env:
        ENACT_ENVIRONMENT_FILE: enve.cue
        ENACT_PYTHON_INSTALL: bash showcase/scripts/setup.sh backend
        UV_HTTP_RETRIES: "5"
        UV_HTTP_TIMEOUT: "120"
    - name: Warm Go Build & Module Cache
      id: go_l1_seed
      if: ${{ steps.go_l1_cache.outputs.cache-hit != 'true' && hashFiles('**/go.mod', '**/go.sum') != '' }}
      continue-on-error: true
      run: |-
        set -eu
        run_go() {
          if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
            enve run --locked -- sh -eu
          else
            sh -eu
          fi
        }
        run_go <<'ENACT_GO_SEED_EOF'
        if [ -f go.work ]; then
          go mod download
        fi
        find . -maxdepth 4 -name go.mod -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/vendor/*' | sort | while IFS= read -r mod; do
          dir=$(dirname "$mod")
          (cd "$dir" && go mod download)
        done
        if [ -f go.mod ]; then
          go test -vet=off -run='^$' ./...
        else
          find . -maxdepth 4 -name go.mod -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/vendor/*' | sort | while IFS= read -r mod; do
            dir=$(dirname "$mod")
            (cd "$dir" && go test -vet=off -run='^$' ./...)
          done
        fi
        ENACT_GO_SEED_EOF
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ !cancelled() && (steps.runner_caches.outputs.host == '' && steps.node_l1_cache.outputs.cache-hit != 'true' || steps.runner_caches.outputs.host == '' && steps.python_l1_cache.outputs.cache-hit != 'true') && github.event_name != 'pull_request' && github.event_name != 'pull_request' }}
      continue-on-error: true
      run: enact ci cache-delta check
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache .enact/state/pnpm-cache
          node_l1_cache node_modules/.cache
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
        ENACT_CACHE_HITS: |-
          node_l1_cache=${{ steps.node_l1_cache.outputs.cache-hit }}
          python_l1_cache=${{ steps.python_l1_cache.outputs.cache-hit }}
        ENACT_UV_PRUNE: ${{ steps.python_l1_cache.outputs.cache-hit != 'true' }}
    - parallel:
      - name: Save Python build & venv cache
        if: (!cancelled() && (success() || steps.python_install.outcome == 'success') && (github.event_name != 'pull_request' && hashFiles('pyproject.toml', 'requirements.txt') != '' && steps.runner_caches.outputs.host == '' && steps.cache_delta.outputs.python_l1_cache == 'true')) && github.event_name != 'pull_request' && steps.python_l1_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.python_l1_cache.outputs.cache-primary-key }}
          path: |-
            /tmp/.cache/uv
            /tmp/.cache/pip
      - name: Save Node dependency cache
        if: (github.event_name != 'pull_request' && steps.cache_delta.outputs.node_l1_cache == 'true' && steps.runner_caches.outputs.host == '') && github.event_name != 'pull_request' && steps.node_l1_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.node_l1_cache.outputs.cache-primary-key }}
          path: |-
            .enact/state/pnpm-store
            .enact/state/pnpm-cache
            node_modules/.cache
      - name: Save Go build & module seed cache
        if: (github.event_name != 'pull_request' && hashFiles('go.mod', 'go.sum', 'go.work', 'go.work.sum', 'enve.lock') != '' && steps.runner_caches.outputs.host == '') && github.event_name != 'pull_request' && steps.go_l1_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.go_l1_cache.outputs.cache-primary-key }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
