    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ (!cancelled() && steps.runner_caches.outputs.host == '' && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && steps.outputs-lookup.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: |
        # ENACT_CACHE_DELTA: one `<cache id> <path>` line per cached path.
        delta_dir="${RUNNER_TEMP:-/tmp}/enact-cache-delta"
        delta_ids() { awk 'NF { print $1 }' <<<"$ENACT_CACHE_DELTA" | sort -u; }
        # The entries under the cache's paths (dot entries pruned: locks and temporaries), sorted.
        delta_list() {
            local want="$1" id path
            while read -r id path; do
                [ "$id" = "$want" ] || continue
                path="${path/#\~/$HOME}"
                [ -d "$path" ] || continue
                find "$path" -mindepth 1 -name '.*' -prune -o -print 2>/dev/null || true
            done <<<"$ENACT_CACHE_DELTA" | LC_ALL=C sort -u
        }
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        set -uo pipefail
        mkdir -p "$delta_dir"
        # uv's CI prune drops the wheels PyPI serves again and keeps the ones built from source.
        if [ "${ENACT_UV_PRUNE:-}" = true ] && [ -d "${UV_CACHE_DIR:-}" ]; then
