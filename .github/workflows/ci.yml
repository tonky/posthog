  test-built:
    name: Run Tests on Built Outputs (${{ matrix.component }})
    needs:
    - detect
    - build-outputs
    - build-outputs-2
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.built != '{"include":[]}' && needs.detect.outputs.built != '[]' && needs.detect.outputs.built != '' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.detect.outputs.built) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        #!/usr/bin/env bash
        # The runner's host cache: `ENACT_HOST_CACHE` names a directory the host mounts read-write
        # into every job and keeps across jobs. `repo/` holds this repository's stores; `shared/`,
        # seen by every repository the host serves, holds only signature-verified content: the enve
        # NAR mirror (`ENVE_MIRROR`), which enve reads first and fills with the paths it pulled and
        # verified (signed by cache.nixos.org or a key in `ENVE_TRUSTED_PUBLIC_KEYS`); a tampered
        # entry fails verification and enve falls back to the next substituter. Concurrent jobs share both: enve, uv, pnpm and Go lock their
        # own stores, and the git mirror is fetched under a lock. The host drops the least recently
        # used entries under `repo/` and `shared/` whole, so each store owns one, touched on every use.
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        # enve's trust check of a store directory, which it otherwise leaves for a fallback store
        # without a word: from `/` down, each component owned by root or the user and writable by
        # no one else, a root-owned sticky ancestor excepted.
        trusted_store() {
            local path="" part owner mode uid
            uid=$(id -u)
            IFS=/ read -ra parts <<<"${1#/}"
            for part in "${parts[@]}"; do
                path="$path/$part"
                read -r owner mode < <(stat -c '%u %a' "$path" 2>/dev/null || stat -f '%u %Mp%Lp' "$path")
                mode=$((8#$mode))
                [ "$owner" = 0 ] || [ "$owner" = "$uid" ] || return 1
                if (( mode & 8#22 )); then
                    [ "$owner" = 0 ] && (( mode & 8#1000 )) && [ "$path" != "$1" ] || return 1
                fi
            done
        }
        # The layout, one line per store: `<variable> <entry> <path under the entry>`; the git mirror
        # names a repository, every other path a directory.
        layout() {
            cat <<LAYOUT
        ENVE_STORE_DIR repo/enve-store .
        UV_CACHE_DIR repo/uv .
        PIP_CACHE_DIR repo/pip .
        ENACT_PNPM_STORE repo/pnpm .
        npm_config_cache repo/npm .
        YARN_CACHE_FOLDER repo/yarn .
        BUN_INSTALL_CACHE_DIR repo/bun .
        GOMODCACHE repo/go mod
        GOCACHE repo/go build
        ENACT_GIT_MIRROR repo/git ${GITHUB_REPOSITORY##*/}.git
        ENVE_MIRROR shared/enve-nar .
        LAYOUT
        }
        if [ -n "$host" ]; then
            # The repository's stores are writable by no one else: enve trusts no other store.
            # `shared/` stays as the host made it, writable by the jobs of every repository.
            umask 022
            chmod go-w "$host/repo" 2>/dev/null || true
            # The enve store check reads what enve wrote since.
            touch "${RUNNER_TEMP:-/tmp}/enact-host-cache.stamp"
            while read -r var entry path; do
                # The host provides `shared/`; without it the NAR mirror is skipped.
                { [ -d "$host/${entry%%/*}" ] && [ -w "$host/${entry%%/*}" ]; } || continue
                mkdir -p "$host/$entry"
                touch "$host/$entry"
                dir="$host/$entry/$path"
                case "$var" in
                    ENACT_GIT_MIRROR) ;;
                    *) mkdir -p "$dir" ;;
                esac
                dir="${dir%/.}"
                if [ "${entry%%/*}" = repo ]; then
                    chmod 755 "$host/$entry" 2>/dev/null || true
                    [ ! -d "$dir" ] || chmod 755 "$dir" 2>/dev/null || true
                fi
                if [ "$var" = ENVE_STORE_DIR ] && ! trusted_store "$dir"; then
                    echo "::error::enve won't trust $dir (an owner other than $(id -un) or root, or writable by others, on the way from /) and would store elsewhere: fix the host cache's ownership and modes"
                    exit 1
                fi
                [ "$var" != ENVE_MIRROR ] || dir="file://$dir"
                echo "$var=$dir" >> "$GITHUB_ENV"
            done < <(layout)
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        #!/usr/bin/env bash
        # Checks the commit out through the host cache's mirror of the repository
        # (`ENACT_GIT_MIRROR`, from the runner cache probe): the mirror fetches what it lacks under its
        # lock, and the work tree borrows its objects (alternates), so the checkout has the whole
        # history at the cost of a few new commits. `ENACT_SPARSE_CONE`: the cone's directories,
        # one per line; none checks the whole tree out.
        set -euo pipefail
        git config --global --add safe.directory "*"
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        refs=("+refs/heads/*:refs/heads/*")
        case "$GITHUB_REF" in
            refs/pull/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags --prune "$url" "${refs[@]}"
            if ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags "$url" "$GITHUB_SHA"
            fi
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        # A half-made repository would mislead the fallback checkout into reusing it.
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        # A fresh work tree, as actions/checkout leaves one: nothing of an earlier job survives.
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        git fetch -q --no-tags "$mirror" "+refs/heads/*:refs/remotes/origin/*"
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            mapfile -t cone < <(printf '%s\n' "$ENACT_SPARSE_CONE" | sed '/^[[:space:]]*$/d')
            git sparse-checkout set --cone "${cone[@]}"
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H through the host mirror'
      env:
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: ${{ matrix.sparse_checkout }}
    - name: Checkout Repository (sparse)
      if: ${{ matrix.sparse_checkout != '' && (steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure') }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: ${{ matrix.sparse_checkout }}
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Checkout Repository (full)
      if: ${{ matrix.sparse_checkout == '' && (steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure') }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        submodules: "false"
    - name: Restore Built Outputs (frontend:build)
      if: ${{ matrix.output_keys['frontend--build'] != '' }}
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-outputs-frontend--build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_keys['frontend--build'] }}
