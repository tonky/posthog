          rust/feature-flags/tests/fixtures
          services/hogql-language-service/internal/completion
          services/mcp/schema
          services/mcp/src/templates
          tools
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Install committed enact & enve builds
      run: |
        # The repository's committed enact, enve and bubblewrap builds: bin/<os>-<arch>/ for this runner
        # (bin/linux-x86_64/, bin/linux-aarch64/), else bin/. They're copied to ~/.cargo/bin,
        # which goes ahead of bin/ on PATH, so the runner's own build wins over bin/'s. A build for
        # another CPU (an x86_64 enve on an arm64 runner) is never installed: enact or enve fails
        # here, naming the directory to commit, instead of the first step that runs it.
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        # Whether this runner can execute $1: false only for an ELF of another CPU or OS.
        runs_here() {
          local header
          header="$(od -An -tx1 -N20 "$1" 2>/dev/null | tr -d ' \n')"
          [ "${header:0:8}" = 7f454c46 ] || return 0
          case "$PLATFORM:${header:36:4}" in
            linux-x86_64:3e00 | linux-aarch64:b700) return 0 ;;
          esac
          return 1
        }
        mkdir -p "$HOME/.cargo/bin"
        if [ -d "$BIN_DIR" ]; then
          for b in enact enve bwrap; do
            src="$BIN_DIR/$b"
            if [ -f "$BIN_DIR/$PLATFORM/$b" ]; then
              src="$BIN_DIR/$PLATFORM/$b"
            fi
            [ -f "$src" ] || continue
            if ! runs_here "$src"; then
              if [ "$b" = bwrap ]; then
                echo "::warning::bin/$b is a build for another CPU than this $PLATFORM runner: not installed"
                continue
              fi
              echo "::error title=No $b for $PLATFORM::bin/$b is a build for another CPU; commit this runner's as bin/$PLATFORM/$b"
              exit 1
            fi
            chmod +x "$src" 2>/dev/null || true
            cp -f "$src" "$HOME/.cargo/bin/$b"
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Ensure enve & enact CLI on PATH
      run: |
        git config --global --add safe.directory "*" 2>/dev/null || true
        # The store the runner cache probe chose (a host cache's), else the user store.
        store="${ENVE_STORE_DIR:-$HOME/.local/share/enve/store}"
        mkdir -p "$store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$store" /nix/store 2>/dev/null || true
        fi
        # The previous step's $GITHUB_PATH entries apply from the next step on.
        export PATH="$HOME/.cargo/bin:${GITHUB_WORKSPACE:-$PWD}/bin:$PATH"
        # Isolation as on a Linux workstation: with bubblewrap on PATH (e.g. the repository's
        # bin/bwrap), enve sandboxes commands and services and maps the profile's hosts inside.
        # GitHub's Ubuntu runners restrict unprivileged user namespaces (AppArmor), which bwrap
        # needs; the VM is disposable, so lift that. Without a working bwrap, enve runs on the host:
        # its profile's host aliases go to the runner's /etc/hosts instead.
        if command -v bwrap >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 \
          && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if command -v bwrap >/dev/null 2>&1 && bwrap --bind / / true 2>/dev/null; then
          echo "enve isolation: $(bwrap --version)"
        elif command -v sudo >/dev/null 2>&1 && command -v enve >/dev/null 2>&1 && [ -f enve.cue ]; then
          enve cue export -q -e profiles.dev.hosts enve.cue 2>/dev/null \
            | jq -r 'to_entries[] | "\(.value) \(.key)"' 2>/dev/null \
            | sudo tee -a /etc/hosts >/dev/null || true
        fi
    - parallel:
      - name: Restore enact Task CAS Cache
        id: enact-tasks-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
          path: .enact/state/cache
          restore-keys: ${{ runner.os }}-enact-tasks-
      - name: Restore Python build & venv cache
        id: python_l1_cache
        if: hashFiles('pyproject.toml', 'requirements.txt') != '' && steps.runner_caches.outputs.host == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-python-${{ hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') }}
          path: |-
            /tmp/.cache/uv
            /tmp/.cache/pip
          restore-keys: ${{ runner.os }}-python-
      - name: Restore Cache [frontend tsgo declaration-emit cache]
        id: cache_frontend_tsgo
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: frontend-tsgo-${{ runner.os }}-${{ github.sha }}
          path: .enact/state/tsgo
          restore-keys: frontend-tsgo-${{ runner.os }}-
      - name: Restore Cache [mypy fine-grained cache]
        id: cache_mypy
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: mypy-${{ runner.os }}-${{ github.sha }}
          path: .mypy_cache
          restore-keys: mypy-${{ runner.os }}-
    - name: Record Restored Package Caches
      if: ${{ steps.runner_caches.outputs.host == '' }}
      continue-on-error: true
      run: |
        # ENACT_CACHE_DELTA: one `<cache id> <path>` line per cached path.
        delta_dir="${RUNNER_TEMP:-/tmp}/enact-cache-delta"
        delta_ids() { awk 'NF { print $1 }' <<<"$ENACT_CACHE_DELTA" | sort -u; }
        # The entries under the cache's paths (dot entries pruned: locks and temporaries), sorted.
        delta_list() {
            local want="$1" id path
            while read -r id path; do
                [ "$id" = "$want" ] || continue
                path="${path/#\~/$HOME}"
                [ -d "$path" ] || continue
                find "$path" -mindepth 1 -name '.*' -prune -o -print 2>/dev/null || true
            done <<<"$ENACT_CACHE_DELTA" | LC_ALL=C sort -u
        }
        set -euo pipefail
        mkdir -p "$delta_dir"
        for id in $(delta_ids); do
            delta_list "$id" > "$delta_dir/$id.restored"
            printf '%s: %s entries after the restore\n' "$id" "$(wc -l < "$delta_dir/$id.restored")"
        done
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
    - name: Download the Reach Map
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: enact-reach-map
        path: ${{ runner.temp }}/enact-reach
    - name: Plan with the Detected Reach Map
      run: |-
        if [ -f "$RUNNER_TEMP/enact-reach/map.bin" ]; then
          echo "ENACT_REACH_FILE=$RUNNER_TEMP/enact-reach/map.bin" >> "$GITHUB_ENV"
        fi
    - name: Pull Dependencies via enve
      run: |-
        store="${ENVE_STORE_DIR:-$HOME/.local/share/enve/store}"
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$store" /nix/store 2>/dev/null || true
        fi
        if [ -f "enve.lock" ]; then
          enve run --locked -- true
        fi
    - name: Check enve Stores into the Host Cache
      if: ${{ steps.runner_caches.outputs.host != '' }}
      run: |
        #!/usr/bin/env bash
        # enve materializes into `ENVE_STORE_DIR` only while it trusts the directory, and otherwise
        # falls back to its user store or `/tmp/enve-<uid>/store` without failing: on a runner with
        # a host cache that throws the persistent store away on every run. Fails when the job's enve
        # calls wrote into a fallback since the runner cache probe.
        set -euo pipefail
        stamp="${RUNNER_TEMP:-/tmp}/enact-host-cache.stamp"
        for fallback in "${XDG_DATA_HOME:-$HOME/.local/share}/enve/store" "/tmp/enve-$(id -u)/store"; do
            { [ "$fallback" != "$ENVE_STORE_DIR" ] && [ -d "$fallback" ]; } || continue
            if [ -n "$(find "$fallback" -mindepth 1 -maxdepth 1 -newer "$stamp" -print -quit 2>/dev/null)" ]; then
                echo "::error::enve stored into $fallback, not the host cache's $ENVE_STORE_DIR, which it doesn't trust (an owner other than $(id -un) or root, or writable by others)"
                exit 1
            fi
        done
        echo "enve stores into the host cache: $ENVE_STORE_DIR"
    - name: Install Python Dependencies
      id: python_install
      if: hashFiles('pyproject.toml', 'requirements.txt') != ''
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        echo "🐍 Ensuring Python environment and dependencies..."
        $RUN_PREFIX sh -c "$ENACT_PYTHON_INSTALL"
        echo "ENACT_PREPARED=${ENACT_PREPARED:+$ENACT_PREPARED,}python" >> "$GITHUB_ENV"
      env:
        ENACT_PYTHON_INSTALL: bash showcase/scripts/setup.sh backend
    - name: Seed [products:typecheck]
      run: enact run --pipeline .enact --workflow ci --all --no-cache -c products:typecheck
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ !cancelled() && steps.runner_caches.outputs.host == '' && github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' }}
      continue-on-error: true
      run: |
        # ENACT_CACHE_DELTA: one `<cache id> <path>` line per cached path.
        delta_dir="${RUNNER_TEMP:-/tmp}/enact-cache-delta"
        delta_ids() { awk 'NF { print $1 }' <<<"$ENACT_CACHE_DELTA" | sort -u; }
        # The entries under the cache's paths (dot entries pruned: locks and temporaries), sorted.
        delta_list() {
            local want="$1" id path
            while read -r id path; do
                [ "$id" = "$want" ] || continue
                path="${path/#\~/$HOME}"
                [ -d "$path" ] || continue
                find "$path" -mindepth 1 -name '.*' -prune -o -print 2>/dev/null || true
            done <<<"$ENACT_CACHE_DELTA" | LC_ALL=C sort -u
        }
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        set -uo pipefail
        mkdir -p "$delta_dir"
        # uv's CI prune drops the wheels PyPI serves again and keeps the ones built from source.
        if [ "${ENACT_UV_PRUNE:-}" = true ] && [ -d "${UV_CACHE_DIR:-}" ]; then
            # shellcheck disable=SC2086 # the prefix is a command line
            ${RUN_PREFIX}uv cache prune --ci || echo "uv cache prune skipped"
        fi
        for id in $(delta_ids); do
            now="$delta_dir/$id.now"
            delta_list "$id" > "$now"
            if [ ! -s "$now" ]; then
                changed=false why="nothing to save"
            elif [ ! -f "$delta_dir/$id.restored" ]; then
                changed=true why="no record of its restore"
            else
                added=$(LC_ALL=C comm -13 "$delta_dir/$id.restored" "$now" | wc -l | tr -d ' ')
                if [ "$added" -gt 0 ]; then changed=true; else changed=false; fi
                why="$added entries the restore lacked"
            fi
            printf '%s=%s\n' "$id" "$changed" >> "$GITHUB_OUTPUT"
            printf '%s: save %s (%s)\n' "$id" "$changed" "$why"
        done
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
        ENACT_UV_PRUNE: "true"
    - name: Save Python build & venv cache
      if: (!cancelled() && (success() || steps.python_install.outcome == 'success') && (github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' && hashFiles('pyproject.toml', 'requirements.txt') != '' && steps.runner_caches.outputs.host == '' && steps.cache_delta.outputs.python_l1_cache == 'true')) && steps.python_l1_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.python_l1_cache.outputs.cache-primary-key }}
        path: |-
          /tmp/.cache/uv
          /tmp/.cache/pip
    - parallel:
      - name: Save Cache [frontend tsgo declaration-emit cache]
        if: (github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.cache_frontend_tsgo.outputs.cache-matched-key, format('frontend-tsgo-{0}-', runner.os)))) && steps.cache_frontend_tsgo.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_frontend_tsgo.outputs.cache-primary-key }}
          path: .enact/state/tsgo
      - name: Save Cache [mypy fine-grained cache]
        if: (github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.cache_mypy.outputs.cache-matched-key, format('mypy-{0}-', runner.os)))) && steps.cache_mypy.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_mypy.outputs.cache-primary-key }}
          path: .mypy_cache
    - name: Upload Telemetry for [seed-products-typecheck]
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-stage-seed-products-typecheck
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
        retention-days: "1"
    - name: Upload Recorded Footprints
      if: ${{ always() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-footprints-stage-seed-products-typecheck
        path: .enact/state/cache/trace-reach.d/
        retention-days: "1"
  summary:
    name: Telemetry & Summary
    needs:
    - detect
    - preflight
