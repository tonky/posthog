            ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}-
            ${{ runner.os }}-rust-rust_target-${{ hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock') }}-${{ fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_cache }}-
      - name: Restore Rust target & cargo cache [rust/target] from the Host Cache
        if: ${{ (hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') != '' && contains(format(',{0},', fromJson(needs.detect.outputs.stage_cargo)['preflight'].cargo_targets), ',rust/target,') && steps.runner_caches.outputs.host != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        run: |-
          src="$ENACT_HOST_CACHE/repo/cargo-target/$ENACT_RUST_HOST_KEY"
