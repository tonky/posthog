      - name: Save Cache [frontend tsgo declaration-emit cache]
        if: ${{ (((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && contains(format(',{0},', matrix.caches), ',frontend-tsgo,') && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.cache_frontend_tsgo.outputs.cache-matched-key, format('frontend-tsgo-{0}-', runner.os)))) && steps.cache_frontend_tsgo.outputs.cache-hit != 'true') && steps.outputs-lookup.outputs.cache-hit != 'true' }}
        continue-on-error: true
