      run: |-
        echo "::error title=Cache seed needed::$ENACT_SEED_MESSAGE"
        exit 1
      env:
        ENACT_SEED_MESSAGE: "cache 'frontend tsgo declaration-emit cache' needs a seed: its jobs never start cold. Run workflow '${{ github.workflow }}' on the default branch by workflow_dispatch with seed_caches=true, then rerun this one."
    - name: Require Seeded Cache [mypy fine-grained cache]
      if: contains(format(',{0},', matrix.caches), ',mypy,') && !(github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true') && steps.cache_mypy.outputs.cache-matched-key == ''
      run: |-
        echo "::error title=Cache seed needed::$ENACT_SEED_MESSAGE"
        exit 1
      env:
        ENACT_SEED_MESSAGE: "cache 'mypy fine-grained cache' needs a seed: its jobs never start cold. Run workflow '${{ github.workflow }}' on the default branch by workflow_dispatch with seed_caches=true, then rerun this one."
    - name: Download the Reach Map
      continue-on-error: true
      uses: actions/download-artifact@v8
