            ${RUN_PREFIX}uv cache prune --ci || echo "uv cache prune skipped"
        fi
        for id in $(delta_ids); do
            now="$delta_dir/$id.now"
            delta_list "$id" > "$now"
            if [ ! -s "$now" ]; then
                changed=false why="nothing to save"
            elif [ ! -f "$delta_dir/$id.restored" ]; then
                changed=true why="no record of its restore"
            else
                added=$(LC_ALL=C comm -13 "$delta_dir/$id.restored" "$now" | wc -l | tr -d ' ')
                if [ "$added" -gt 0 ]; then changed=true; else changed=false; fi
                why="$added entries the restore lacked"
            fi
            printf '%s=%s\n' "$id" "$changed" >> "$GITHUB_OUTPUT"
            printf '%s: save %s (%s)\n' "$id" "$changed" "$why"
        done
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
        ENACT_UV_PRUNE: "true"
    - name: Save Python build & venv cache
