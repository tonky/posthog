                  ### 1. Full Monorepo Parity & tmpfs Multi-Service Sharding (-n 0 across 20 Runners)
                  - **20 Parallel Shards**: Partitions 100% of the repository's 4,919 backend test files (~61,475 tests) across 20 balanced runners within GitHub Actions free-tier concurrency limits.
