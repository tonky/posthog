        fi
      env:
        ENACT_RUST_HOST_KEY: ${{ runner.os }}-rust-funnel_udf_target-${{ hashFiles('enve.lock', 'funnel-udf/rust-toolchain.toml', 'funnel-udf/rust-toolchain', 'funnel-udf/enve.lock') }}-${{ matrix.cargo_cache }}
        ENACT_RUST_TARGET: funnel-udf/target
    - name: Check Rust target & cargo cache [rust/target] size limit (<= 1.5 GiB)
      id: rust_l1_cache_rust_target_size_guard
      if: ${{ (env.ENACT_SAVE_EVENT == 'true' && contains(format(',{0},', matrix.cargo_targets), ',rust/target,') && hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') != '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1') && steps.runner_caches.outputs.host == '') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
      continue-on-error: true
      run: |-
        total_kb=$(du -sk "$ENACT_RUST_TARGET" 2>/dev/null | awk '{print $1}')
