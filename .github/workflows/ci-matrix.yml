          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
      - name: Save Rust target & cargo cache [funnel-udf/target]
        if: ${{ (((env.ENACT_SAVE_EVENT == 'true' && hashFiles('funnel-udf/Cargo.lock', 'funnel-udf/**/Cargo.toml') != '' && contains(format(',{0},', matrix.cargo_targets), ',funnel-udf/target,') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.rust_l1_cache_funnel_udf_target.outputs.cache-matched-key, format('{0}-rust-funnel_udf_target-{1}-{2}-{3}-', runner.os, hashFiles('enve.lock', 'funnel-udf/rust-toolchain.toml', 'funnel-udf/rust-toolchain', 'funnel-udf/enve.lock'), matrix.cargo_cache, hashFiles('funnel-udf/Cargo.lock', 'funnel-udf/**/Cargo.toml'))))) && steps.rust_l1_cache_funnel_udf_target.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
