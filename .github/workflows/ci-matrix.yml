    - name: Prune Rust caches before saving
      if: ${{ (env.ENACT_SAVE_EVENT == 'true' && matrix.cargo_targets != '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: enact cache prune-cargo --pipeline .enact
    - parallel:
      - name: Save Go build cache
        if: ${{ (((env.ENACT_SAVE_EVENT == 'true' && hashFiles('**/go.mod', '**/go.sum') != '' && contains(matrix.technology, 'go') && steps.runner_caches.outputs.host == '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.go_l1_cache.outputs.cache-matched-key, format('{0}-go-{1}-', runner.os, hashFiles('**/go.mod', '**/go.sum'))))) && steps.go_l1_cache.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.go_l1_cache.outputs.cache-primary-key }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
      - name: Save Rust target & cargo cache [cli/target]
        if: ${{ (((env.ENACT_SAVE_EVENT == 'true' && hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') != '' && contains(format(',{0},', matrix.cargo_targets), ',cli/target,') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.rust_l1_cache_cli_target.outputs.cache-matched-key, format('{0}-rust-cli_target-{1}-{2}-{3}-', runner.os, hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock'), matrix.cargo_cache, hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml'))))) && steps.rust_l1_cache_cli_target.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
