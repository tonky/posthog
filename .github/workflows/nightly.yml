    - name: Ensure enve & enact CLI on PATH
      run: enact ci setup-runner
    - name: Restore Reach Store
      id: reach-store
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-reach-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
        path: .git/enact/reach
        restore-keys: |-
          enact-reach-${{ github.head_ref || github.ref_name }}-
          enact-reach-${{ github.base_ref || github.event.repository.default_branch }}-
    - name: Download Recorded Footprints
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/enact-footprints
        pattern: enact-footprints-*
    - name: Consolidate the Reach Map
      id: consolidate_reach
      run: |-
        cd "${GITHUB_WORKSPACE}"
        if [ -n "$(find "$RUNNER_TEMP/enact-footprints" -name '*.bin' -print -quit 2>/dev/null)" ] || [ "$GITHUB_EVENT_NAME" = push ]; then
