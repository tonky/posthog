        name: telemetry-${{ matrix.task_id }}
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
          .enact/state/nodejs/*.services.log
        retention-days: "1"
    - name: Upload Recorded Footprints
      if: ${{ (always() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch)) && !steps.skip.outputs.hit }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-footprints-${{ matrix.task_id }}
        path: .enact/state/cache/trace-reach.d/
        retention-days: "1"
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ (!cancelled() && (steps.runner_caches.outputs.host == '' || contains(format(',{0},', matrix.caches), ',backend-templates,')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: enact ci cache-delta check
      env:
