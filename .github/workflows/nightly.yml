    - name: Verify Cache publication [Backend database templates]
      id: cache_backend_templates_publication
      if: ${{ (!cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && contains(format(',{0},', matrix.caches), ',backend-templates,') && steps.cache_backend_templates.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
