        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.go_l1_cache.outputs.cache-primary-key }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
      - name: Save Rust target & cargo cache [cli/target]
        if: ${{ ((((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml') != '' && contains(format(',{0},', matrix.cargo_targets), ',cli/target,') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.rust_l1_cache_cli_target.outputs.cache-matched-key, format('{0}-rust-cli_target-{1}-{2}-{3}-', runner.os, hashFiles('enve.lock', 'cli/rust-toolchain.toml', 'cli/rust-toolchain', 'cli/enve.lock'), matrix.cargo_cache, hashFiles('cli/Cargo.lock', 'cli/**/Cargo.toml'))))) && steps.rust_l1_cache_cli_target.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.rust_l1_cache_cli_target.outputs.cache-primary-key }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cli/target
      - name: Save Rust target & cargo cache [funnel-udf/target]
        if: ${{ ((((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && hashFiles('funnel-udf/Cargo.lock', 'funnel-udf/**/Cargo.toml') != '' && contains(format(',{0},', matrix.cargo_targets), ',funnel-udf/target,') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.rust_l1_cache_funnel_udf_target.outputs.cache-matched-key, format('{0}-rust-funnel_udf_target-{1}-{2}-{3}-', runner.os, hashFiles('enve.lock', 'funnel-udf/rust-toolchain.toml', 'funnel-udf/rust-toolchain', 'funnel-udf/enve.lock'), matrix.cargo_cache, hashFiles('funnel-udf/Cargo.lock', 'funnel-udf/**/Cargo.toml'))))) && steps.rust_l1_cache_funnel_udf_target.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.rust_l1_cache_funnel_udf_target.outputs.cache-primary-key }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            funnel-udf/target
      - name: Save Rust target & cargo cache [rust/target]
        if: ${{ ((((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') != '' && contains(format(',{0},', matrix.cargo_targets), ',rust/target,') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.rust_l1_cache_rust_target.outputs.cache-matched-key, format('{0}-rust-rust_target-{1}-{2}-{3}-', runner.os, hashFiles('enve.lock', 'rust/rust-toolchain.toml', 'rust/rust-toolchain', 'rust/enve.lock'), matrix.cargo_cache, hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml'))))) && steps.rust_l1_cache_rust_target.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.rust_l1_cache_rust_target.outputs.cache-primary-key }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
      - name: Save Cache [Backend database templates]
        if: ${{ ((!cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && contains(format(',{0},', matrix.caches), ',backend-templates,') && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.cache_backend_templates.outputs.cache-matched-key, format('backend-templates-4-{0}-', runner.os)) || steps.cache_delta.outputs.cache_backend_templates == 'true') && steps.cache_backend_templates_publication.outputs.eligible == 'true' && steps.cache_backend_templates_publication.outcome == 'success') && steps.cache_backend_templates.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_backend_templates.outputs.cache-primary-key }}
          path: ~/.cache/enact/snapshots/v3
      - name: Save Cache [frontend tsgo declaration-emit cache]
        if: ${{ (((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && contains(format(',{0},', matrix.caches), ',frontend-tsgo,') && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.cache_frontend_tsgo.outputs.cache-matched-key, format('frontend-tsgo-{0}-', runner.os)))) && steps.cache_frontend_tsgo.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_frontend_tsgo.outputs.cache-primary-key }}
          path: .enact/state/tsgo
      - name: Save Cache [Standalone HogVM native target]
        if: ${{ (((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && contains(format(',{0},', matrix.caches), ',hogvm-native,')) && steps.cache_hogvm_native.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_hogvm_native.outputs.cache-primary-key }}
          path: rust/common/hogvm/node/target
      - name: Save Cache [mypy fine-grained cache]
        if: ${{ (((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && contains(format(',{0},', matrix.caches), ',mypy,') && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.cache_mypy.outputs.cache-matched-key, format('mypy-{0}-', runner.os)))) && steps.cache_mypy.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_mypy.outputs.cache-primary-key }}
          path: .mypy_cache
    - name: Save Built Outputs to the Host Cache
      if: ${{ success() && steps.runner_caches.outputs.host != '' && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: enact ci host-outputs save
      env:
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
    - name: Cache Built Outputs
      if: ${{ success() && !steps.skip.outputs.hit }}
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        path: ${{ matrix.output_paths }}
  build-outputs-2:
    name: Build Outputs (${{ matrix.component }})
    needs:
    - detect
    - build-outputs
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.builds_2 != '{"include":[]}' && needs.detect.outputs.builds_2 != '[]' && needs.detect.outputs.builds_2 != '' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.detect.outputs.builds_2) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Look Up Built Outputs in the Host Cache
      id: outputs-host-lookup
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        store="${ENACT_OUTPUTS_CACHE:-}"
        entry="$store/${GITHUB_REPOSITORY:-repo}/$ENACT_OUTPUTS_KEY"
        clone_item() {
            rm -rf "$2"
            mkdir -p "$(dirname "$2")"
            cp -a --reflink=auto "$1" "$2" 2>/dev/null || { rm -rf "$2"; cp -a "$1" "$2"; }
        }
        case "$ENACT_OUTPUTS_MODE" in
            lookup)
                hit=false
                if [ -n "$store" ] && [ -f "$entry/.enact-ready" ]; then
                    hit=true
                    while IFS= read -r pattern; do
                        [ -n "$pattern" ] || continue
                        # shellcheck disable=SC2086 # glob pattern from outputs.paths
                        for src in "$entry"/$pattern; do
                            [ -e "$src" ] || [ -L "$src" ] || { hit=false; break 2; }
                        done
                    done <<<"$ENACT_OUTPUTS_PATHS"
                fi
                if [ "$hit" = true ]; then
                    touch "$entry/.enact-ready" 2>/dev/null || true
                fi
                printf 'cache-hit=%s\n' "$hit" >> "$GITHUB_OUTPUT"
                ;;
            restore)
                hit=false
                if [ -n "$store" ] && [ -f "$entry/.enact-ready" ]; then
                    hit=true
                    while IFS= read -r pattern; do
                        [ -n "$pattern" ] || continue
                        # shellcheck disable=SC2086 # glob pattern from outputs.paths
                        for src in "$entry"/$pattern; do
                            [ -e "$src" ] || [ -L "$src" ] || { hit=false; break 2; }
                            rel="${src#"$entry"/}"
                            clone_item "$src" "$rel" || { hit=false; break 2; }
                        done
                    done <<<"$ENACT_OUTPUTS_PATHS"
                fi
                if [ "$hit" = true ]; then
                    touch "$entry/.enact-ready" 2>/dev/null || true
                fi
                printf 'cache-hit=%s\n' "$hit" >> "$GITHUB_OUTPUT"
                ;;
            save)
                [ -n "$store" ] || exit 0
                [ ! -f "$entry/.enact-ready" ] || exit 0
                mkdir -p "$(dirname "$entry")"
                tmp=$(mktemp -d "$entry.tmp.XXXXXX")
                trap 'rm -rf "$tmp"' EXIT
                while IFS= read -r pattern; do
                    [ -n "$pattern" ] || continue
                    # shellcheck disable=SC2086 # glob pattern from outputs.paths
                    for src in $pattern; do
                        [ -e "$src" ] || [ -L "$src" ] || exit 1
                        clone_item "$src" "$tmp/$src"
                    done
                done <<<"$ENACT_OUTPUTS_PATHS"
                touch "$tmp/.enact-ready"
                chmod -R a+rX "$tmp" 2>/dev/null || true
                if ! mv -n "$tmp" "$entry" 2>/dev/null && [ ! -d "$entry" ]; then
                    rm -rf "$entry"
                    mv "$tmp" "$entry"
                fi
                repo_dir="$(dirname "$entry")"
                max_entries="${ENACT_OUTPUTS_CACHE_MAX_ENTRIES:-8}"
                min_free_mb="${ENACT_OUTPUTS_CACHE_MIN_FREE_MB:-5120}"
                ready_files=()
                while IFS= read -r ready; do
                    [ -n "$ready" ] && ready_files+=("$ready")
                done < <(ls -1dt "$repo_dir"/*/.enact-ready 2>/dev/null || true)
                total="${#ready_files[@]}"
                for (( idx = total - 1; idx >= 0; idx-- )); do
                    cand_dir="$(dirname "${ready_files[$idx]}")"
                    [ "$cand_dir" != "$entry" ] || continue
                    evict=false
                    if [ "$max_entries" -gt 0 ] && [ "$((idx + 1))" -gt "$max_entries" ]; then
                        evict=true
                    elif [ "$min_free_mb" -gt 0 ]; then
                        free_mb="$(df -Pk "$store" 2>/dev/null | awk 'NR==2 {print int($4 / 1024)}')"
                        if [ -n "$free_mb" ] && [ "$free_mb" -lt "$min_free_mb" ]; then
                            evict=true
                        fi
                    fi
                    if [ "$evict" = true ]; then
                        rm -rf "$cand_dir" 2>/dev/null || true
                    fi
                done
