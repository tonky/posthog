      if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact run --pipeline .enact --workflow nightly --all --no-cache -c products:typecheck
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ (!cancelled() && steps.runner_caches.outputs.host == '' && github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact ci cache-delta check
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
        ENACT_UV_PRUNE: "true"
    - name: Save Python build & venv cache
      if: ${{ ((!cancelled() && (success() || steps.python_install.outcome == 'success') && (github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' && steps.stage_plan.outputs.stage_needs_python == 'true' && hashFiles('pyproject.toml', 'requirements.txt') != '' && steps.runner_caches.outputs.host == '' && steps.cache_delta.outputs.python_l1_cache == 'true')) && steps.python_l1_cache.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      uses: actions/cache/save@v6
