          path: rust/common/hogvm/node/target
          restore-keys: hogvm-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task_id }}-${{ hashFiles('enve.lock', 'enve.cue', 'rust/Cargo.toml', '.cargo/config*', 'rust/.cargo/config*', 'rust/common/.cargo/config*', 'rust/common/hogvm/.cargo/config*', 'rust/common/hogvm/node/.cargo/config*', 'rust-toolchain*', 'rust/rust-toolchain*', 'rust/common/hogvm/Cargo.toml', 'rust/common/hogvm/build.rs', 'rust/common/hogvm/src/**', 'rust/common/hogvm/node/Cargo.toml', 'rust/common/hogvm/node/Cargo.lock', 'rust/common/hogvm/node/build.rs', 'rust/common/hogvm/node/src/**', 'rust/common/hogvm/node/package.json', 'rust/common/hogvm/node/turbo.json', 'turbo.json', '.enact/*.cue', 'showcase/scripts/run_nodejs_tests.sh', 'showcase/scripts/build_hogvm.sh', 'showcase/scripts/rust_ci_env.sh') }}
      - name: Restore Cache [mypy fine-grained cache]
