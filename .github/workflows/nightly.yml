    - name: Prune Rust caches before saving
      if: ${{ ((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && matrix.cargo_targets != '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: enact cache prune-cargo --pipeline .enact
    - parallel:
      - name: Save Go build cache
