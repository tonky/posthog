        ENACT_UV_PRUNE: "true"
    - name: Save Python build & venv cache
      if: ${{ ((!cancelled() && (success() || steps.python_install.outcome == 'success') && ((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') != '' && contains(matrix.technology, 'python') && steps.runner_caches.outputs.host == '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1') && steps.cache_delta.outputs.python_l1_cache == 'true')) && steps.python_l1_cache.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
      continue-on-error: true
