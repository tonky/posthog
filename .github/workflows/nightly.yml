    - name: Require Seeded Cache [mypy fine-grained cache]
      if: ${{ (contains(format(',{0},', matrix.caches), ',mypy,') && !(github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true') && steps.cache_mypy.outputs.cache-matched-key == '') && !steps.skip.outputs.hit }}
