          .stylelintrc.js
          .stylelintignore
          .nvmrc
          .kearc
          postcss.config.js
          pyproject.toml
          uv.lock
          conftest.py
          pytest.ini
          pytest_boot_gc.py
          .test_quarantine.json
          manage.py
          hogli.yaml
          posthog.json
          owners.yaml
          tach.toml
          depot.json
          dist-workspace.toml
          dagster_cloud.yaml
          rust
          posthog
          ee
          products
          common
          tools/hogli-commands
          proto
          docker
          infra
          .github/rust-images.yml
    - name: Checkout Repository (sparse)
      if: ${{ steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: |-
