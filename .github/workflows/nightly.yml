        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
          path: .enact/state/cache
          restore-keys: ${{ runner.os }}-enact-tasks-
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: ${{ (steps.stage_plan.outputs.stage_needs_node == 'true' && steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v2-stage-seed-frontend-typecheck-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
          restore-keys: |-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-stage-seed-frontend-typecheck-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-
      - name: Restore Cache [frontend tsgo declaration-emit cache]
        id: cache_frontend_tsgo
        if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: frontend-tsgo-${{ runner.os }}-${{ github.sha }}
          path: .enact/state/tsgo
          restore-keys: frontend-tsgo-${{ runner.os }}-
    - name: Record Restored Package Caches
      if: ${{ (steps.runner_caches.outputs.host == '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact ci cache-delta record
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
    - name: Pull Dependencies via enve
      if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact ci deps pull --remote signed
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Check enve Stores into the Host Cache
      if: ${{ (steps.runner_caches.outputs.host != '') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact ci check-store
    - name: Install Project Dependencies
      if: ${{ (hashFiles('package.json') != '' && steps.stage_plan.outputs.stage_needs_node == 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        echo "📦 Installing project dependencies..."
        ENACT_INSTALL_INPUTS=$(mktemp "$RUNNER_TEMP/enact-install-inputs.XXXXXX")
        sha256sum pnpm-lock.yaml > "$ENACT_INSTALL_INPUTS"
        for input in package.json pnpm-workspace.yaml enve.lock; do
          if [ -f "$input" ]; then sha256sum "$input" >> "$ENACT_INSTALL_INPUTS"; fi
        done
        $RUN_PREFIX pnpm install "$@" --frozen-lockfile --store-dir "${ENACT_PNPM_STORE:-$PWD/.enact/state/pnpm-store}" --offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink --config.fetch-retries=2 --config.fetch-retry-maxtimeout=10000 --network-concurrency=16 ||
          $RUN_PREFIX pnpm install "$@" --frozen-lockfile --store-dir "${ENACT_PNPM_STORE:-$PWD/.enact/state/pnpm-store}" --prefer-offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink --config.fetch-retries=2 --config.fetch-retry-maxtimeout=10000 --network-concurrency=16 || exit $?
        sha256sum --check "$ENACT_INSTALL_INPUTS"
        rm "$ENACT_INSTALL_INPUTS"
        echo "ENACT_PREPARED=${ENACT_PREPARED:+$ENACT_PREPARED,}node" >> "$GITHUB_ENV"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Seed [frontend:typecheck]
      if: ${{ steps.stage_plan.outputs.stage_has_work == 'true' }}
      run: enact run --pipeline .enact --workflow nightly --all --no-cache -c frontend:typecheck
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ (!cancelled() && steps.runner_caches.outputs.host == '' && github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
      continue-on-error: true
      run: enact ci cache-delta check
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
    - parallel:
      - name: Save Cache [frontend tsgo declaration-emit cache]
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.cache_frontend_tsgo.outputs.cache-matched-key, format('frontend-tsgo-{0}-', runner.os)))) && steps.cache_frontend_tsgo.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_frontend_tsgo.outputs.cache-primary-key }}
          path: .enact/state/tsgo
      - name: Save Node dependency cache
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' && steps.stage_plan.outputs.stage_needs_node == 'true' && steps.cache_delta.outputs.node_l1_cache == 'true' && steps.runner_caches.outputs.host == '') && steps.node_l1_cache.outputs.cache-hit != 'true') && steps.stage_plan.outputs.stage_has_work == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.node_l1_cache.outputs.cache-primary-key }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
    - name: Upload Telemetry for [seed-frontend-typecheck]
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-stage-seed-frontend-typecheck
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
          .enact/state/nodejs/*.services.log
        retention-days: "1"
    - name: Upload Recorded Footprints
      if: ${{ always() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-footprints-stage-seed-frontend-typecheck
        path: .enact/state/cache/trace-reach.d/
        retention-days: "1"
  seed-products-typecheck:
    name: "Seed caches: Products typecheck"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_caches == 'true' }}
    runs-on:
    - self-hosted
    - Linux
    - X64
    - tonky-ci
    - tonky-ci-l
    timeout-minutes: 90
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        git config --global --add safe.directory "*"
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        refs=("+refs/heads/*:refs/heads/*")
        case "$GITHUB_REF" in
            refs/pull/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            ref_current=""
            case "$GITHUB_REF" in
                refs/heads/*|refs/pull/*) ref_current=$(git -C "$mirror" rev-parse --verify -q "$GITHUB_REF^{commit}" 2>/dev/null || true) ;;
                *) ref_current="$GITHUB_SHA" ;;
            esac
            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$GITHUB_SHA" ] || ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags --prune "$url" "${refs[@]}"
                if ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags "$url" "$GITHUB_SHA"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        git fetch -q --no-tags "$mirror" "+refs/heads/*:refs/remotes/origin/*"
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            mapfile -t cone < <(printf '%s\n' "$ENACT_SPARSE_CONE" | sed '/^[[:space:]]*$/d')
            git sparse-checkout set --cone "${cone[@]}"
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H through the host mirror'
      env:
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          showcase
          patches
          tools/hogli
          packages/owners-yaml
          packages/personhog-proto
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          turbo.json
          tsconfig.json
          tsconfig.dev.json
          tsconfig.kea-typegen.json
          .oxfmtrc.json
          .oxlintrc.json
          .prettierignore
          .stylelintrc.js
          .stylelintignore
          .nvmrc
          .kearc
