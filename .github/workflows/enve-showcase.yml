name: PostHog DevEx Showcase (enve)

on:
    push:
        branches:
            - 'showcase/**'
    pull_request:
        branches:
            - master
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: enve-showcase-${{ github.ref }}
    cancel-in-progress: true

jobs:
    devex-showcase:
        name: Zero-Daemon DevEx & Layered OCI Showcase
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET: ${{ secrets.R2_BUCKET || 'posthog-enve' }}
            R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || 'https://847959617b8d3ada9eb84238a37f56ec.r2.cloudflarestorage.com' }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Install enve CLI
              env:
                  GH_TOKEN: ${{ secrets.ENVE_RELEASE_TOKEN || secrets.ENVE_TOKEN || secrets.GITHUB_TOKEN }}
                  ENVE_PUBLIC_URL: ${{ secrets.ENVE_PUBLIC_URL }}
              run: |
                  mkdir -p "$HOME/.local/bin"
                  INSTALLED=0
                  if [ -x "$GITHUB_WORKSPACE/showcase/bin/enve" ]; then
                    echo "Using pre-staged enve binary from $GITHUB_WORKSPACE/showcase/bin/enve..."
                    cp "$GITHUB_WORKSPACE/showcase/bin/enve" "$HOME/.local/bin/enve"
                    INSTALLED=1
                  elif [ -x "showcase/bin/enve" ]; then
                    echo "Using pre-staged enve binary from showcase/bin/enve..."
                    cp "showcase/bin/enve" "$HOME/.local/bin/enve"
                    INSTALLED=1
                  elif [ -n "${GH_TOKEN:-}" ]; then
                    echo "Attempting to download enve from GitHub release via API..."
                    ASSET_URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/tonky/enve/releases/tags/v1.0.0-alpha.1 2>/dev/null | jq -r '.assets[] | select(.name | test("x86_64-unknown-linux-musl.tar.gz$")) | .url' || true)
                    if [ -n "$ASSET_URL" ] && [ "$ASSET_URL" != "null" ]; then
                      if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$ASSET_URL" | tar -xz -C "$HOME/.local/bin"; then
                        INSTALLED=1
                      fi
                    fi
                  fi

                  if [ "$INSTALLED" -eq 0 ] && [ -n "${GH_TOKEN:-}" ] && command -v gh >/dev/null 2>&1; then
                    echo "Attempting to download enve from GitHub release via gh..."
                    if gh release download v1.0.0-alpha.1 --repo tonky/enve --pattern "*x86_64-unknown-linux-musl.tar.gz" --output - | tar -xz -C "$HOME/.local/bin"; then
                      INSTALLED=1
                    fi
                  fi

                  if [ "$INSTALLED" -eq 0 ] && [ -n "${ENVE_PUBLIC_URL:-}" ]; then
                    echo "Downloading enve from public storage..."
                    if curl -fsSL "$ENVE_PUBLIC_URL" | tar -xz -C "$HOME/.local/bin"; then
                      INSTALLED=1
                    fi
                  fi

                  if [ "$INSTALLED" -eq 0 ]; then
                    echo "Downloading enve from GitHub release via curl..."
                    curl -fsSL https://github.com/tonky/enve/releases/download/v1.0.0-alpha.1/enve-v1.0.0-alpha.1-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$HOME/.local/bin"
                  fi

                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                  chmod +x "$HOME/.local/bin/enve"
                  "$HOME/.local/bin/enve" --version

                  # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor by default
                  if command -v sudo >/dev/null 2>&1; then
                    sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
                    sudo mkdir -p /nix 2>/dev/null && sudo chmod 777 /nix 2>/dev/null || true
                  elif command -v sysctl >/dev/null 2>&1; then
                    sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
                    mkdir -p /nix 2>/dev/null && chmod 777 /nix 2>/dev/null || true
                  fi

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: 'Cold Start: Hermetic Store Materialization (enve cache pull)'
              env:
                  ENVE_CACHE_CONCURRENCY: 16
              run: |
                  # Ensure rootless store directory is traversable by dropped-privilege UID 1000 (postgres)
                  if [ "$(id -u)" -eq 0 ]; then
                    chmod 755 /root || true
                    mkdir -p "$HOME/.local/share/enve/store"
                    chmod -R a+rX "$HOME/.local" 2>/dev/null || true
                  fi

                  # Link /nix/store directly to rootless store to bypass namespace remapping
                  mkdir -p "$HOME/.local/share/enve/store"
                  if [ -d "/nix" ] && [ ! -e "/nix/store" ]; then
                    if command -v sudo >/dev/null 2>&1 && [ ! -w "/nix" ]; then
                      sudo ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
                    else
                      ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
                    fi
                  fi

                  # Benchmark authentic cold closure hydration from Cloudflare R2
                  START_COLD=$(date +%s%N)
                  CACHE_URL="s3://${R2_BUCKET}?endpoint=${R2_ENDPOINT}&region=auto"
                  TRUSTED_KEY="posthog-cache:ZoJXYKq9GR/XjY0NV2O62NY1zUagRC66U/81IE/W/XU="
                  echo "Executing cold store materialization: pulling closures from $CACHE_URL with 16 parallel streams..."
                  if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
                    enve cache pull showcase/enve.lock --cache "$CACHE_URL" --trusted-public-key "$TRUSTED_KEY" --jobs 16
                  else
                    echo "Notice: Remote S3 credentials not set; pulling from upstream cache..."
                    enve cache pull showcase/enve.lock --jobs 16
                  fi

                  # First-invocation cold shell verification
                  enve run -f showcase/enve.cue -- echo "Hermetic shell ready (cold start)"
                  END_COLD=$(date +%s%N)
                  COLD_MS=$(( (END_COLD - START_COLD) / 1000000 ))
                  COLD_SEC=$(awk "BEGIN {printf \"%.2f\", $COLD_MS / 1000}")
                  echo "COLD_START_DURATION=${COLD_SEC}s" >> "$GITHUB_ENV"
                  echo "Authentic Cold Start completed in ${COLD_SEC}s (zero daemon, 100% user-space store)"

            - name: Warm environment & dependencies
              run: |
                  START_WARM=$(date +%s%N)
                  echo "Starting concurrent hydration across 3 streams: Python venv, GeoIP database, Quill dependencies..."

                  # Stream 1: Python Virtualenv L2 Cache Hydration & Hermetic Sync
                  restore_venv() {
                    set -euo pipefail
                    VENV_HASH="$(sha256sum uv.lock | awk '{print $1}')"
                    VENV_KEY="cache/posthog-venv-${VENV_HASH}.tar.zst"
                    echo "VENV_KEY=${VENV_KEY}" >> "$GITHUB_ENV"
                    if [ ! -d ".venv" ]; then
                      echo "[venv] Checking L2 Cloudflare R2 binary cache for pre-built virtualenv (${VENV_KEY})..."
                      if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
                        START_VENV=$(date +%s%N)
                        if aws s3 cp "s3://${R2_BUCKET}/${VENV_KEY}" - --endpoint-url "${R2_ENDPOINT}" 2>/dev/null | tar -I "zstd -d -T0" -xf - 2>/dev/null; then
                          END_VENV=$(date +%s%N)
                          VENV_SEC=$(awk "BEGIN {printf \"%.2f\", ($END_VENV - $START_VENV) / 1000000000}")
                          echo "[venv] L2 Cache Hit: Restored .venv directly from Cloudflare R2 in ${VENV_SEC}s"
                        fi
                      fi
                    fi

                    if [ ! -d ".venv" ]; then
                      echo "[venv] L2 Cache Miss: Installing python dependencies with uv in hermetic enve environment..."
                      enve run -f showcase/enve.cue -- uv sync --frozen
                      rm -rf .venv/lib/python*/site-packages/nvidia* 2>/dev/null || true
                      echo "SAVE_VENV_CACHE=1" >> "$GITHUB_ENV"
                    else
                      echo "[venv] Verifying virtualenv consistency with uv..."
                      enve run -f showcase/enve.cue -- uv sync --frozen
                    fi
                  }

                  # Stream 2: Restore GeoIP database
                  restore_geoip() {
                    set -euo pipefail
                    if [ ! -f "share/GeoLite2-City.mmdb" ]; then
                      echo "[geoip] Restoring GeoIP database from remote S3/R2 binary cache..."
                      mkdir -p share
                      START_GEOIP=$(date +%s%N)
                      RESTORED=0
                      if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
                        if aws s3 cp "s3://${R2_BUCKET}/share/GeoLite2-City.mmdb" share/GeoLite2-City.mmdb --endpoint-url "${R2_ENDPOINT}" 2>/dev/null; then
                          RESTORED=1
                        fi
                      fi
                      if [ "$RESTORED" -eq 0 ] || [ ! -s "share/GeoLite2-City.mmdb" ]; then
                        curl -sL "https://mmdbcdn.posthog.net/" --http1.1 2>/dev/null | brotli --decompress --output=share/GeoLite2-City.mmdb 2>/dev/null || touch share/GeoLite2-City.mmdb
                      fi
                      END_GEOIP=$(date +%s%N)
                      GEOIP_SEC=$(awk "BEGIN {printf \"%.2f\", ($END_GEOIP - $START_GEOIP) / 1000000000}")
                      echo "[geoip] GeoIP database ready in ${GEOIP_SEC}s"
                    fi
                  }

                  # Stream 3: Quill frontend workspace installation & L2 streaming cache
                  restore_quill() {
                    set -euo pipefail
                    FE_HASH="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
                    QUILL_KEY="cache/posthog-quill-${FE_HASH}.tar.zst"
                    echo "QUILL_KEY=${QUILL_KEY}" >> "$GITHUB_ENV"
                    if [ ! -d "node_modules" ] || [ ! -d "packages/quill/packages/components/node_modules" ]; then
                      if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
                        echo "[quill] Checking L2 Cloudflare R2 binary cache for Quill dependencies (${QUILL_KEY})..."
                        START_QUILL=$(date +%s%N)
                        if aws s3 cp "s3://${R2_BUCKET}/${QUILL_KEY}" - --endpoint-url "${R2_ENDPOINT}" 2>/dev/null | tar -I "zstd -d" -xf - 2>/dev/null; then
                          END_QUILL=$(date +%s%N)
                          QUILL_SEC=$(awk "BEGIN {printf \"%.2f\", ($END_QUILL - $START_QUILL) / 1000000000}")
                          echo "[quill] L2 Cache Hit: Restored Quill dependencies directly from Cloudflare R2 in ${QUILL_SEC}s"
                        fi
                      fi
                    fi

                    if [ ! -d "node_modules" ] || [ ! -d "packages/quill/packages/components/node_modules" ]; then
                      echo "[quill] L2 Cache Miss: Installing Quill frontend workspace dependencies (skipping lifecycle scripts)..."
                      START_QUILL_INST=$(date +%s%N)
                      HUSKY=0 pnpm install --frozen-lockfile --prefer-offline --ignore-scripts --filter=@posthog/quill-components...
                      END_QUILL_INST=$(date +%s%N)
                      QUILL_INST_SEC=$(awk "BEGIN {printf \"%.2f\", ($END_QUILL_INST - $START_QUILL_INST) / 1000000000}")
                      echo "[quill] Quill dependencies installed via pnpm in ${QUILL_INST_SEC}s"
                      echo "SAVE_QUILL_CACHE=1" >> "$GITHUB_ENV"
                    fi
                  }

                  restore_venv &
                  PID_VENV=$!

                  restore_geoip &
                  PID_GEOIP=$!

                  restore_quill &
                  PID_QUILL=$!

                  FAILED=0
                  wait "$PID_VENV" || { echo "Error: Python venv hydration failed" >&2; FAILED=1; }
                  wait "$PID_GEOIP" || { echo "Error: GeoIP database restore failed" >&2; FAILED=1; }
                  wait "$PID_QUILL" || { echo "Error: Quill frontend hydration failed" >&2; FAILED=1; }

                  if [ "$FAILED" -ne 0 ]; then
                    exit 1
                  fi

                  END_WARM=$(date +%s%N)
                  WARM_SEC=$(awk "BEGIN {printf \"%.2f\", ($END_WARM - $START_WARM) / 1000000000}")
                  echo "Concurrent hydration completed across all 3 streams in ${WARM_SEC}s"

            - name: Run DevEx Showcase Suite
              env:
                  ENVE_SERVICE_UID: 1000
                  ENVE_SERVICE_GID: 1000
              run: ./showcase/scripts/run_showcase.sh

            - name: Save remote binary caches (post-success)
              if: success() && (env.SAVE_VENV_CACHE == '1' || env.SAVE_QUILL_CACHE == '1')
              run: |
                  if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
                    echo "Notice: Remote S3 credentials not set; skipping cache upload."
                    exit 0
                  fi

                  START_UPLOAD=$(date +%s%N)
                  echo "Saving verified binary caches to Cloudflare R2 post-success..."

                  upload_venv() {
                    set -euo pipefail
                    if [ "${SAVE_VENV_CACHE:-0}" = "1" ] && [ -d ".venv" ]; then
                      echo "[venv] Uploading slimmed virtualenv to L2 Cloudflare R2 (${VENV_KEY})..."
                      tar --exclude='__pycache__' --exclude='*.pyc' -I "zstd -1 -T0" -cf - .venv | aws s3 cp - "s3://${R2_BUCKET}/${VENV_KEY}" --endpoint-url "${R2_ENDPOINT}" 2>/dev/null || true
                      echo "[venv] Upload complete."
                    fi
                  }

                  upload_quill() {
                    set -euo pipefail
                    if [ "${SAVE_QUILL_CACHE:-0}" = "1" ] && [ -d "node_modules" ]; then
                      echo "[quill] Uploading Quill dependencies to L2 Cloudflare R2 (${QUILL_KEY})..."
                      tar --exclude='*.tsbuildinfo' -I "zstd -1 -T0" -cf - node_modules packages/quill/packages/*/node_modules 2>/dev/null | aws s3 cp - "s3://${R2_BUCKET}/${QUILL_KEY}" --endpoint-url "${R2_ENDPOINT}" 2>/dev/null || true
                      echo "[quill] Upload complete."
                    fi
                  }

                  upload_venv &
                  PID_U_VENV=$!

                  upload_quill &
                  PID_U_QUILL=$!

                  wait "$PID_U_VENV" 2>/dev/null || true
                  wait "$PID_U_QUILL" 2>/dev/null || true

                  END_UPLOAD=$(date +%s%N)
                  UPLOAD_SEC=$(awk "BEGIN {printf \"%.2f\", ($END_UPLOAD - $START_UPLOAD) / 1000000000}")
                  echo "Cache publication completed in ${UPLOAD_SEC}s"
