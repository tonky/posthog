# =============================================================================
#  Docker Compose generated by enve for posthog-monorepo
#  Run: enve up --docker  (or docker compose up -d)
# =============================================================================

name: "posthog-monorepo"

services:
  capture:
    image: "alpine:latest"
    restart: unless-stopped
    command: cargo run --manifest-path services/capture/Cargo.toml
    ports:
      - "18000:18000"
    depends_on:
      - redis
      - redpanda
      - clickhouse
    healthcheck:
      test:
        - "CMD-SHELL"
        - "nc -z localhost 18000 || exit 1"
      interval: 5s
      timeout: 5000ms
      retries: 5

  clickhouse:
    image: "alpine:latest"
    restart: unless-stopped
    command: clickhouse-server --config-file data/clickhouse/config.xml
    ports:
      - "18123:18123"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "nc -z localhost 18123 || exit 1"
      interval: 5s
      timeout: 5000ms
      retries: 5

  postgres:
    image: "postgres:17-alpine"
    restart: unless-stopped
    ports:
      - "15432:15432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - "postgres_pgdata:/var/lib/postgresql/data"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "nc -z localhost 15432 || exit 1"
      interval: 5s
      timeout: 5000ms
      retries: 5

  redis:
    image: "redis:7-alpine"
    restart: unless-stopped
    ports:
      - "16379:16379"
    volumes:
      - "redis_data:/data"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "nc -z localhost 16379 || exit 1"
      interval: 5s
      timeout: 3000ms
      retries: 5

  redpanda:
    image: "alpine:latest"
    restart: unless-stopped
    command: redpanda --redpanda-cfg data/redpanda/conf/redpanda.yaml --smp 1 --memory 512M
    ports:
      - "19092:19092"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "nc -z localhost 19092 || exit 1"
      interval: 5s
      timeout: 5000ms
      retries: 5

  temporal:
    image: "alpine:latest"
    restart: unless-stopped
    command: temporal server start-dev --port 17233 --headless
    ports:
      - "17233:17233"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "nc -z localhost 17233 || exit 1"
      interval: 5s
      timeout: 5000ms
      retries: 5

volumes:
  postgres_pgdata:
  redis_data:

